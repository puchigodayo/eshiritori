<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,interactive-widget=overlays-content">
<meta name="theme-color" content="#5b3df5">
<title>えしりとり</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--g:rgba(255,255,255,.17);--b:rgba(255,255,255,.4);--ac:#0a84ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;color:#fff;overflow:hidden;background:#2a1f6b;user-select:none;-webkit-user-select:none}
.bg{position:fixed;inset:0;background:linear-gradient(160deg,#4f46e5,#d946ef 55%,#fb923c);overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.65;animation:fl 16s ease-in-out infinite alternate}
@keyframes fl{to{transform:translate(40px,-60px) scale(1.2)}}
.screen{position:fixed;inset:0;display:none;flex-direction:column;gap:12px;padding:max(env(safe-area-inset-top),12px) 12px max(env(safe-area-inset-bottom),12px)}
.screen.on{display:flex}
.glass{background:var(--g);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--b);border-radius:26px;box-shadow:0 10px 36px rgba(30,10,80,.25),inset 0 1px 0 rgba(255,255,255,.55)}
.card{padding:18px;display:flex;flex-direction:column;gap:12px;justify-content:center}
.btn{border:0;border-radius:16px;padding:15px;font:inherit;font-size:17px;font-weight:700;color:#fff;background:var(--ac);width:100%;transition:transform .12s,opacity .12s;cursor:pointer}
.btn:active{transform:scale(.97);opacity:.85}.btn:disabled{opacity:.4}
.btn.s{background:rgba(255,255,255,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.in{width:100%;border:1px solid var(--b);background:rgba(255,255,255,.2);color:#fff;border-radius:16px;padding:14px;font:inherit;font-size:19px;text-align:center;outline:0;user-select:text;-webkit-user-select:text}
.in::placeholder{color:rgba(255,255,255,.65)}.in:focus{background:rgba(255,255,255,.3)}
.in.sh{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
h1,h2,p{margin:0}.dim{opacity:.85;text-align:center}.msg{text-align:center;min-height:22px;font-weight:600}
.av{border-radius:50%;background-size:cover;background-position:center;display:grid;place-items:center;color:#fff;font-weight:800;flex:none;border:3px solid rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(40,10,90,.3)}
.av.md{width:48px;height:48px;font-size:22px}.av.lg{width:clamp(64px,9vw,120px);height:clamp(64px,9vw,120px);font-size:clamp(28px,4vw,52px)}.av.xl{width:140px;height:140px;font-size:64px;cursor:pointer;align-self:center}
/* menu */
#menu.on{display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow:auto}
#menu .hero{text-align:center}#menu h1{font-size:44px;letter-spacing:.04em;text-shadow:0 4px 24px rgba(60,20,120,.4)}
.side{display:flex;flex-direction:column;gap:12px}.side .card{flex:1}
.code{font-size:44px;font-weight:800;letter-spacing:.14em;font-variant-numeric:tabular-nums;user-select:text;-webkit-user-select:text}
/* lobby */
.top{display:flex;align-items:center;gap:14px;padding:10px 16px}
.lbody{flex:1;min-height:0;display:grid;gap:12px;grid-template-columns:1fr}
#slots{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);grid-auto-rows:1fr;min-height:0;overflow:auto}
.slot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;min-height:110px}
.slot b{font-size:20px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.slot span{opacity:.85;font-size:14px}
.slot .av{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px)}}
.slot.empty{background:rgba(255,255,255,.07);border-style:dashed}.wt{opacity:.7!important;font-size:16px!important}
.wt i{font-style:normal;animation:bl 1.2s infinite}@keyframes bl{50%{opacity:.2}}
.set label{display:flex;justify-content:space-between;font-weight:700}input[type=range]{width:100%;accent-color:#fff}
/* play */
.badge{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.92);color:#5b3df5;font-size:26px;font-weight:800;display:grid;place-items:center;flex:none}
#rd{font-weight:700}#who{flex:1;font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm{display:flex;align-items:center;gap:8px;width:150px}#tn{font-size:26px;font-weight:800;width:44px;text-align:right;font-variant-numeric:tabular-nums}
.barw{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.28);overflow:hidden}#bar{height:100%;background:#fff;transition:width 1s linear}
.tm.low #bar{background:#ff453a}.tm.low #tn{color:#ffd0cc}
.pbody{flex:1;min-height:0;display:grid;gap:12px;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto}
#plist{padding:8px;display:flex;gap:6px;overflow:auto}
.pi{display:flex;gap:12px;align-items:center;padding:8px 10px;border-radius:20px;flex:none;transition:.2s}.pi.act{background:rgba(255,255,255,.3);box-shadow:inset 0 0 0 2px #fff}
.aw{position:relative}.aw i{position:absolute;right:-6px;bottom:-6px;font-style:normal;font-size:16px;background:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.pt{display:none;flex-direction:column;min-width:0}.pt b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pt span{font-size:13px;opacity:.9}
.stage{container-type:size;display:grid;place-items:center;overflow:hidden;min-height:0}
.sq{position:relative;width:min(100cqw,100cqh);height:min(100cqw,100cqh)}
.sq canvas,.sq img{position:absolute;inset:0;width:100%;height:100%;background:#fff;touch-action:none}
#ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:20px;line-height:1.6}
#ph b{font-size:min(30cqw,120px);line-height:1;text-shadow:0 6px 24px rgba(60,20,120,.4)}#ph small{opacity:.9;font-size:18px}
.rcol{display:flex;flex-direction:column;gap:12px;min-height:0}
.panel{padding:14px;display:flex;flex-direction:column;gap:10px}.panel>div{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px}.tools{flex-direction:row!important;align-items:center;gap:6px!important;flex-wrap:wrap}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.7);padding:0;cursor:pointer}.dot.on{outline:3px solid #fff;outline-offset:2px}
.tools input[type=range]{flex:1;min-width:80px}
#hint{text-align:center;font-size:18px;line-height:1.5}#hint b{letter-spacing:.2em;font-size:22px}
#hl{display:none;flex:1;min-height:0;overflow:auto;padding:10px;flex-direction:column;gap:8px}
.hi{display:flex;align-items:center;gap:10px;font-weight:700}.hi img{width:56px;height:56px;border-radius:12px;background:#fff;flex:none}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(40,20,90,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:5}
.ov .card{width:min(560px,100%);max-height:100%;overflow:auto;text-align:center}.ov h2{font-size:34px}
#gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}#gal figure{margin:0;font-size:13px}#gal img{width:100%;aspect-ratio:1;border-radius:12px;background:#fff;display:block}
#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-90px);padding:12px 18px;border-radius:20px;font-weight:600;z-index:60;transition:transform .3s}#toast.on{transform:translate(-50%,0)}
#crop{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(30,10,80,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#crop .card{width:min(340px,92vw);align-items:center}#cc{width:256px;height:256px;border-radius:50%;background:#fff;touch-action:none;cursor:grab;border:3px solid #fff}
.tl{display:flex;gap:8px}.tb{flex:1;border:0;border-radius:14px;padding:8px 4px;background:rgba(255,255,255,.22);color:#fff;font:inherit;font-size:20px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}.tb span{font-size:12px;font-weight:700}.tb.on{background:#fff;color:#5b3df5}
.pal{display:flex;flex-wrap:wrap;gap:6px;align-items:center}#cpk{width:34px;height:34px;border:0;padding:0;background:none;border-radius:50%;cursor:pointer}
.szr{display:flex;align-items:center;gap:10px}.szr input{flex:1}.pwv{width:36px;height:36px;display:grid;place-items:center;flex:none}#szp{border-radius:50%;border:2px solid #fff;display:block}.szr b{width:28px;text-align:right}
#pd .btn{padding:11px;font-size:15px}
.nb{width:76px;padding:6px 8px;border-radius:12px;border:1px solid var(--b);background:rgba(255,255,255,.2);color:#fff;text-align:center;font:inherit;font-size:18px;outline:0;user-select:text;-webkit-user-select:text}
.nb:disabled{opacity:.7}
#panel.kb{position:fixed;left:8px;right:8px;bottom:calc(var(--kb,0px) + 8px);z-index:20}#panel.kb .btn.s{display:none}
.msg:empty{display:none}
@media(max-width:899px){.tb span{display:none}.dot{width:26px;height:26px}}
/* Switch風エラー */
#err{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6)}
.dlg{width:min(620px,92vw);background:#ebebeb;color:#2d2d2d;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.5);font-family:"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;animation:pop .2s}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.dlg .bd{padding:36px 40px 30px;text-align:center}.dlg h3{margin:0 0 18px;font-size:22px;font-weight:600}.dlg p{margin:0;font-size:18px;line-height:1.7}.dlg small{display:block;margin-top:16px;color:#777;font-size:13px}
.dlg .ft{border-top:1px solid #c8c8c8;padding:14px 20px;display:flex;justify-content:center}
.dlg button{min-width:240px;padding:14px;font:inherit;font-size:20px;color:#2d2d2d;background:transparent;border:3px solid #00c3e3;border-radius:4px;cursor:pointer;animation:pl 1.2s infinite alternate}
@keyframes pl{to{box-shadow:0 0 0 4px rgba(0,195,227,.35);border-color:#00e1ff}}
@media(min-width:900px){
 .screen{padding:12px}
 #menu.on{grid-template-columns:1fr 1fr;grid-template-rows:1fr;overflow:hidden}#menu h1{font-size:64px}.av.xl{width:200px;height:200px;font-size:90px}
 .side .card h2{font-size:28px}.code{font-size:56px}
 .lbody{grid-template-columns:1fr 380px}#slots{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr)}
 .pbody{grid-template-columns:280px minmax(0,1fr) 360px;grid-template-rows:minmax(0,1fr)}
 #plist{flex-direction:column;padding:10px}.pt{display:flex}.pi{padding:10px 12px}.av.md{width:56px;height:56px}#hl{display:flex}
}
</style>
</head>
<body>
<div class="bg"><i style="width:300px;height:300px;background:#22d3ee;left:-80px;top:-60px"></i><i style="width:260px;height:260px;background:#fde047;right:-70px;top:38%;animation-delay:-5s"></i><i style="width:320px;height:320px;background:#f43f5e;left:20%;bottom:-120px;animation-delay:-9s"></i></div>

<section id="menu" class="screen on">
  <div class="glass card">
    <div class="hero"><h1>🎨 えしりとり</h1><p class="dim">みんなで絵をつないで、お題を当てよう</p></div>
    <div id="myav" class="av xl"></div>
    <button class="btn s" onclick="$('#file').click()">アイコンをかえる</button>
    <input id="file" type="file" accept="image/*" hidden>
    <input id="nm" class="in" maxlength="8" placeholder="なまえ（8文字まで）" autocomplete="off">
  </div>
  <div class="side">
    <div class="glass card"><h2>部屋をつくる</h2><p class="dim">最大8人まで参加できます</p><button class="btn" onclick="host()">部屋をつくる</button></div>
    <div class="glass card"><h2>部屋に参加</h2><input id="cin" class="in" inputmode="numeric" maxlength="6" placeholder="6桁のコード" autocomplete="off"><button class="btn s" onclick="join()">参加する</button><p id="mmsg" class="msg"></p></div>
  </div>
</section>

<section id="lobby" class="screen">
  <div class="glass top"><div><small>ルームコード</small><div id="rcode" class="code" style="font-size:36px">------</div></div><div style="flex:1"></div><div id="lcnt" style="font-size:28px;font-weight:800">1 / 8</div></div>
  <div class="lbody">
    <div id="slots"></div>
    <div class="glass card set">
      <h2>ゲーム設定</h2>
      <label>お題を決める時間<span><input id="nw" class="nb" type="number" min="10" max="180" inputmode="numeric"> 秒</span></label><input id="cw" type="range" min="10" max="180" value="30">
      <label>絵を描く時間<span><input id="nd" class="nb" type="number" min="10" max="180" inputmode="numeric"> 秒</span></label><input id="cd" type="range" min="10" max="180" value="30">
      <p class="dim" style="font-size:13px">順番にお題を出して絵をかき、つぎの人が当てます</p>
      <button id="gstart" class="btn" onclick="startGame()">ゲーム開始</button>
      <p id="gwait" class="dim">ホストの開始をまっています…</p>
      <button class="btn s" onclick="toMenu()">部屋を出る</button>
    </div>
  </div>
</section>

<section id="play" class="screen">
  <div class="glass top"><div class="badge" id="lt">あ</div><div id="rd">1わめ</div><div id="who"></div><div id="tm" class="tm"><span id="tn">30</span><div class="barw"><div id="bar"></div></div></div></div>
  <div class="pbody">
    <div id="plist" class="glass"></div>
    <div class="glass stage"><div class="sq"><canvas id="cv"></canvas><img id="pic" alt=""><div id="ph"></div></div></div>
    <div class="rcol">
      <div class="glass panel" id="panel">
        <div id="pw"><input id="win" class="in" placeholder="ひらがなで入力" autocomplete="off"><button class="btn" onclick="submitWord()">決定して絵をかく</button></div>
        <div id="pd">
          <div class="tl"><button class="tb on" data-t="pen">✏️<span>ペン</span></button><button class="tb" data-t="eraser">🧽<span>消しゴム</span></button><button class="tb" data-t="fill">🪣<span>塗りつぶし</span></button></div>
          <div class="pal" id="pal"><input id="cpk" type="color" value="#222222" aria-label="色を選ぶ"></div>
          <div class="szr"><span class="pwv"><i id="szp"></i></span><input id="sz" type="range" min="1" max="60" value="8"><b id="szv">8</b></div>
          <div class="row"><button class="btn s" onclick="undo()">↩ もどす</button><button class="btn s" onclick="redo()">↪ やり直し</button><button class="btn s" onclick="wipe()">🗑</button></div>
          <button class="btn" onclick="sendImg()">送信</button>
        </div>
        <div id="pg"><div id="hint"></div><input id="gin" class="in" placeholder="こたえをひらがなで" autocomplete="off"><button class="btn" onclick="submitGuess()">こたえる</button><button class="btn s" onclick="giveUp()">ギブアップ</button></div>
      </div>
      <div id="hl" class="glass"></div>
    </div>
  </div>
  <div id="ov" class="ov" hidden><div class="glass card">
    <h2 id="ot"></h2><p id="orr"></p><p id="osc" style="font-weight:700"></p><div id="gal"></div>
    <button id="rm" class="btn" onclick="backToLobby()">ロビーにもどる</button>
    <button class="btn s" onclick="toMenu()">メニューにもどる</button>
  </div></div>
</section>

<div id="crop" hidden><div class="glass card"><h2>アイコンを切り抜く</h2><canvas id="cc"></canvas><input id="cz" type="range" min="1" max="4" step=".01" value="1" style="width:256px"><p class="dim" style="font-size:13px">ドラッグで位置、スライダーで拡大</p><div class="row" style="width:100%"><button class="btn s" onclick="$('#crop').hidden=true">キャンセル</button><button class="btn" onclick="cok()">決定</button></div></div></div>
<div id="err" hidden><div class="dlg"><div class="bd"><h3>通信エラー</h3><p>通信エラーが発生しました。<br>メニューにもどります。</p><small>エラーコード: ESIRI-001</small></div><div class="ft"><button onclick="toMenu()">OK</button></div></div></div>
<div id="toast" class="glass"></div>

<script>
const $=s=>document.querySelector(s);
const POOL='あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわ';
const SM={ぁ:'あ',ぃ:'い',ぅ:'う',ぇ:'え',ぉ:'お',ゃ:'や',ゅ:'ゆ',ょ:'よ',っ:'つ',ゎ:'わ'};
const base=c=>c.normalize('NFD')[0];
const lastCh=w=>{const c=w.replace(/ー+$/,'').slice(-1);return SM[c]||c};
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const fmt=s=>s>=60?Math.floor(s/60)+'分'+(s%60?s%60+'秒':''):s+'秒';
const okIcon=s=>typeof s=='string'&&/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(s)&&s.length<60000;
const okImg=s=>typeof s=='string'&&s.startsWith('data:image/jpeg;base64,')&&s.length<500000;
let prof={name:'ゲスト'+(10+Math.floor(Math.random()*90)),icon:''};
try{Object.assign(prof,JSON.parse(localStorage.esiri||'{}'))}catch(e){}
const saveProf=()=>{try{localStorage.esiri=JSON.stringify(prof)}catch(e){}};
let isHost=false,me={id:''},P=[],cfg={word:30,draw:30},conns={},seen={},seenH=0,G={},S={},hist=[],net,tmr,peer,conn,pw='',lastImg='',pic='',tt;

function show(id){document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('on',e.id===id))}
function msg(t){$('#mmsg').textContent=t}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2000)}
const nm=id=>(P.find(p=>p.id==id)||{name:'?'}).name;
function av(p,c){const d=document.createElement('div');d.className='av '+(c||'');
  if(okIcon(p.icon))d.style.backgroundImage='url("'+p.icon+'")';
  else{let h=0;for(const ch of String(p.id||p.name))h=(h*31+ch.charCodeAt(0))%360;d.style.background='hsl('+h+' 65% 55%)';d.textContent=[...p.name][0]||'?'}
  return d}

/* ---------- プロフィール ---------- */
function drawMy(){const n=av({id:'me',name:prof.name,icon:prof.icon},'xl');n.id='myav';n.onclick=()=>$('#file').click();$('#myav').replaceWith(n)}
$('#nm').value=prof.name;$('#nm').oninput=e=>{prof.name=e.target.value.trim().slice(0,8)||'ゲスト';saveProf();drawMy()};drawMy();
let ci,cs,cx0,cy0,cz=1,cd;const cc=$('#cc'),cg=cc.getContext('2d');cc.width=cc.height=256;
$('#file').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const u=URL.createObjectURL(f);ci=new Image();
  ci.onload=()=>{cs=Math.max(256/ci.width,256/ci.height);cz=1;$('#cz').value=1;cx0=(256-ci.width*cs)/2;cy0=(256-ci.height*cs)/2;cdraw();$('#crop').hidden=false;URL.revokeObjectURL(u)};ci.src=u};
function cdraw(){const w=ci.width*cs*cz,h=ci.height*cs*cz;cx0=Math.min(0,Math.max(256-w,cx0));cy0=Math.min(0,Math.max(256-h,cy0));cg.fillStyle='#fff';cg.fillRect(0,0,256,256);cg.drawImage(ci,cx0,cy0,w,h)}
$('#cz').oninput=e=>{const r=+e.target.value/cz;cx0=128-(128-cx0)*r;cy0=128-(128-cy0)*r;cz=+e.target.value;cdraw()};
cc.onpointerdown=e=>{cc.setPointerCapture(e.pointerId);cd=[e.clientX,e.clientY]};
cc.onpointermove=e=>{if(!cd)return;const k=256/cc.getBoundingClientRect().width;cx0+=(e.clientX-cd[0])*k;cy0+=(e.clientY-cd[1])*k;cd=[e.clientX,e.clientY];cdraw()};
cc.onpointerup=()=>cd=null;
function cok(){const o=document.createElement('canvas');o.width=o.height=128;o.getContext('2d').drawImage(cc,0,0,128,128);prof.icon=o.toDataURL('image/jpeg',.85);saveProf();drawMy();$('#crop').hidden=true}

/* ---------- 通信 ---------- */
const up=m=>isHost?hostMsg('h',m):(conn&&conn.open&&conn.send(m));
const tx=(id,m)=>{if(id=='h')recv(m);else{const c=conns[id];c&&c.open&&c.send(m)}};
const toAll=(m,ex)=>P.slice().forEach(p=>p.id!=ex&&tx(p.id,m));
const lob=()=>toAll({t:'lobby',P:P.map(p=>({id:p.id,name:p.name,icon:p.icon})),cfg});
function cleanup(){clearInterval(net);clearInterval(tmr);if(G.to)clearTimeout(G.to);
  const c=conn,cs=conns;conn=null;conns={};
  try{c&&c.close()}catch(e){}Object.values(cs).forEach(x=>{try{x.close()}catch(e){}});
  try{peer&&peer.destroy()}catch(e){}peer=null;P=[];G={};S={};hist=[];$('#ov').hidden=true;$('#err').hidden=true}
function toMenu(){cleanup();isHost=false;show('menu');msg('')}
function showErr(){if(!$('#err').hidden)return;clearInterval(net);clearInterval(tmr);if(G.to)clearTimeout(G.to);$('#err').hidden=false}
function dead(id){
  if(isHost&&id!='h'){
    if(G.ph&&G.ph!='over'){toAll({t:'err'},id);showErr()}
    else{P=P.filter(p=>p.id!=id);try{conns[id].close()}catch(e){}delete conns[id];lob()}
  }else if(!isHost)showErr()}
function startNet(){clearInterval(net);net=setInterval(()=>{const n=Date.now();
  if(isHost){toAll({t:'p'},'h');P.slice().forEach(p=>p.id!='h'&&n-seen[p.id]>12000&&dead(p.id))}
  else{up({t:'p'});if(n-seenH>12000)dead('h')}},1500)}
function host(){
  cleanup();isHost=true;me.id='h';msg('部屋を準備中…');
  const code=String(Math.floor(Math.random()*1e6)).padStart(6,'0');
  peer=new Peer('esiri'+code);
  peer.on('open',()=>{msg('');P=[{id:'h',name:prof.name,icon:prof.icon}];G={};$('#rcode').textContent=code;startNet();lob()});
  peer.on('error',e=>{if(e.type=='unavailable-id')host();else msg('接続エラー: '+e.type)});
  peer.on('connection',c=>{const id=c.peer;
    c.on('open',()=>{
      if(P.length>=8||(G.ph&&G.ph!='over')){c.send({t:P.length>=8?'full':'busy'});setTimeout(()=>c.close(),600);return}
      conns[id]=c;seen[id]=Date.now()});
    c.on('data',m=>{if(conns[id]===c)hostMsg(id,m)});
    c.on('close',()=>{if(conns[id]===c)dead(id)})})}
function join(){
  const code=$('#cin').value.trim();if(!/^\d{6}$/.test(code))return msg('6桁の数字を入力してね');
  cleanup();isHost=false;msg('接続中…');
  peer=new Peer();
  peer.on('open',id=>{me.id=id;const c=conn=peer.connect('esiri'+code,{reliable:true});
    c.on('open',()=>{seenH=Date.now();startNet();c.send({t:'hello',name:prof.name,icon:prof.icon})});
    c.on('data',m=>{seenH=Date.now();recv(m)});
    c.on('close',()=>{if(conn===c)dead('h')});
    setTimeout(()=>{if(conn===c&&!c.open)msg('部屋が見つかりませんでした')},8000)});
  peer.on('error',e=>msg(e.type=='peer-unavailable'?'その部屋はありません':'接続エラー: '+e.type))}

/* ---------- ホスト側ゲーム進行 ---------- */
function startGame(){if(P.length<2)return;G={hist:[],dr:0,word:'',letter:POOL[Math.floor(Math.random()*POOL.length)]};toAll({t:'go'});phase('word')}
function backToLobby(){if(isHost){G={};lob()}else up({t:'tolobby'})}
function phase(ph){G.ph=ph;const sec=ph=='word'?cfg.word:ph=='draw'?cfg.draw:30,n=P.length,gi=(G.dr+1)%n;
  toAll({t:'st',ph,dr:P[G.dr].id,gu:P[gi].id,letter:G.letter,n:G.hist.length+1,sec,len:[...G.word].length});
  clearTimeout(G.to);G.to=setTimeout(()=>over(ph=='guess'?P[gi].id:P[G.dr].id,ph=='word'?'wordtime':ph=='draw'?'drawtime':'giveup'),(sec+3)*1000)}
function over(loser,reason){clearTimeout(G.to);G.ph='over';toAll({t:'over',loser,reason,word:G.word})}
function hostMsg(f,m){seen[f]=Date.now();
  if(m.t=='hello'){if(P.some(p=>p.id==f))return;P.push({id:f,name:String(m.name||'?').slice(0,8),icon:okIcon(m.icon)?m.icon:''});return lob()}
  if(m.t=='tolobby'){if(G.ph=='over')backToLobby();return}
  if(!G.ph||G.ph=='over')return;
  const gi=(G.dr+1)%P.length,dr=P[G.dr].id,gu=P[gi].id;
  if(m.t=='word'&&G.ph=='word'&&f==dr){
    const w=String(m.w).trim(),bad=!/^[ぁ-ゖー]{2,20}$/.test(w)||w[0]=='ー'?'ひらがな2文字以上で入力してね':base(w[0])!=base(G.letter)?'「'+G.letter+'」からはじめてね':G.hist.some(h=>h.word==w)?'その言葉はもう出てるよ':'';
    if(bad)return tx(f,{t:'toast',m:bad});
    G.word=w;if(lastCh(w)=='ん')return over(f,'n');phase('draw')}
  else if(m.t=='img'&&G.ph=='draw'&&f==dr){
    if(!okImg(m.img))return;G.img=m.img;toAll({t:'img',img:m.img},f);phase('guess')}
  else if(m.t=='guess'&&G.ph=='guess'&&f==gu){
    if(String(m.g).trim()==G.word){G.hist.push({word:G.word});G.letter=lastCh(G.word);toAll({t:'ok',word:G.word});G.dr=gi;G.word='';phase('word')}
    else tx(f,{t:'ng'})}
  else if(m.t=='giveup'&&G.ph=='guess'&&f==gu)over(f,'giveup')}

/* ---------- クライアント側 ---------- */
function recv(m){
  if(m.t=='lobby'){if(m.P){P=m.P;cfg=m.cfg}$('#ov').hidden=true;clearInterval(tmr);renderLobby();show('lobby')}
  else if(m.t=='full'||m.t=='busy'){cleanup();show('menu');msg(m.t=='full'?'この部屋は満員です（最大8人）':'この部屋はゲーム中です')}
  else if(m.t=='go'){hist=[];lastImg=pic=pw='';S={};renderHist();renderPlayers();$('#ov').hidden=true;show('play')}
  else if(m.t=='st'){S=m;onSt()}
  else if(m.t=='img')pic=lastImg=m.img;
  else if(m.t=='ok'){hist.push({word:m.word,img:lastImg,by:S.dr});toast('せいかい！「'+m.word+'」');renderHist()}
  else if(m.t=='ng')wrong();
  else if(m.t=='toast')toast(m.m);
  else if(m.t=='over')showOver(m);
  else if(m.t=='err')showErr()}
function renderLobby(){
  $('#lcnt').textContent=P.length+' / 8';const s=$('#slots');s.textContent='';
  for(let i=0;i<8;i++){const p=P[i],d=document.createElement('div');d.className='slot glass'+(p?'':' empty');
    if(p){const a=av(p,'lg');a.style.animationDelay=(-i*.4)+'s';const n=document.createElement('b'),t=document.createElement('span');n.textContent=p.name;t.textContent=p.id=='h'?'👑 ホスト':p.id==me.id?'あなた':'参加中';d.append(a,n,t)}
    else d.innerHTML='<span class="wt">まっています<i>…</i></span>';s.append(d)}
  $('#cw').value=cfg.word;$('#cd').value=cfg.draw;if(document.activeElement!=$('#nw'))$('#nw').value=cfg.word;if(document.activeElement!=$('#nd'))$('#nd').value=cfg.draw;
  ['#cw','#cd','#nw','#nd'].forEach(q=>$(q).disabled=!isHost);$('#gstart').hidden=!isHost;$('#gwait').hidden=isHost;$('#gstart').disabled=P.length<2}
const setT=(k,v)=>{cfg[k]=Math.min(180,Math.max(10,Math.round(+v)||cfg[k]));lob()};
[['cw','nw','word'],['cd','nd','draw']].forEach(([r,n,k])=>{
  $('#'+r).oninput=e=>isHost&&setT(k,e.target.value);
  $('#'+n).oninput=e=>{const v=+e.target.value;if(isHost&&v>=10&&v<=180)setT(k,v)};
  $('#'+n).onchange=e=>isHost&&setT(k,e.target.value)});
function view(p,h){['pw','pd','pg'].forEach(i=>$('#'+i).hidden=i!=p);$('#panel').hidden=!['pw','pd','pg'].includes(p);
  $('#cv').hidden=p!='pd';$('#pic').hidden=!['pg','ps'].includes(p);$('#ph').hidden=!h;if(h)$('#ph').innerHTML=h}
function timer(s,fn){clearInterval(tmr);$('#tm').hidden=!s;if(!s)return;let t=s;
  const u=()=>{$('#tn').textContent=t;$('#bar').style.width=(t/s*100)+'%';$('#tm').classList.toggle('low',t<=5)};
  $('#bar').style.transition='none';u();void $('#bar').offsetWidth;$('#bar').style.transition='';
  tmr=setInterval(()=>{t--;u();if(t<=0){clearInterval(tmr);fn&&fn()}},1000)}
function onSt(){
  const dr=S.dr==me.id,gu=S.gu==me.id,nd=esc(nm(S.dr)),ng=esc(nm(S.gu));
  $('#lt').textContent=S.letter;$('#rd').textContent=S.n+'わめ';
  if(S.ph=='word'){$('#who').textContent='✏️ '+nm(S.dr)+'さんがお題を考え中';
    if(dr){view('pw','<small>お題</small><b>「'+S.letter+'」</b><span>からはじまる言葉をきめよう（ひらがなのみ）</span>');$('#win').value='';$('#win').focus()}
    else view('pt','<small>'+nd+'さん</small><b>✏️</b><span>お題を考えています…</span>');
    timer(S.sec)}
  else if(S.ph=='draw'){$('#who').textContent='🎨 '+nm(S.dr)+'さんが絵をかいてる';
    if(dr){view('pd');clr();timer(S.sec,sendImg)}
    else{view('pt','<small>'+nd+'さん</small><b>🎨</b><span>絵をかいています…</span>');timer(S.sec)}}
  else if(S.ph=='guess'){const n=Math.min(20,S.len|0);$('#who').textContent='🤔 '+nm(S.gu)+'さんが回答中　「'+S.letter+'」から'+n+'文字 '+'○'.repeat(n);
    $('#pic').src=pic;
    if(dr)view('pt','<small>お題「'+esc(pw)+'」</small><b>⏳</b><span>'+ng+'さんが当てるのをまっています…</span>');
    else if(gu){$('#hint').innerHTML='「'+S.letter+'」からはじまる '+n+'文字<br><b>'+'○'.repeat(n)+'</b>';$('#gin').value='';view('pg');$('#gin').focus()}
    else view('ps');
    timer(S.sec,gu?giveUp:null)}
  renderPlayers()}
function renderPlayers(){const l=$('#plist');l.textContent='';
  P.forEach(p=>{let e='👀',t='見てる',a=0;const d=S.dr==p.id,g=S.gu==p.id;
    if(d){a=S.ph!='guess';e=S.ph=='word'?'✏️':S.ph=='draw'?'🎨':'⏳';t=S.ph=='word'?'お題を考え中':S.ph=='draw'?'絵をかいてる':'結果まち'}
    else if(g){a=S.ph=='guess';e=a?'🤔':'💤';t=a?'回答中':'次の番'}
    const r=document.createElement('div');r.className='pi'+(a?' act':'');
    const w=document.createElement('div');w.className='aw';w.append(av(p,'md'));const b=document.createElement('i');b.textContent=e;w.append(b);
    const x=document.createElement('div');x.className='pt';const n=document.createElement('b'),s=document.createElement('span');
    n.textContent=(p.id=='h'?'👑 ':'')+p.name+(p.id==me.id?'（あなた）':'');s.textContent=t;x.append(n,s);r.append(w,x);l.append(r)})}
function renderHist(){const l=$('#hl');l.textContent='';
  hist.slice().reverse().forEach(h=>{const r=document.createElement('div');r.className='hi';const i=document.createElement('img');i.src=h.img||'';const s=document.createElement('span');s.textContent=h.word+'（'+nm(h.by)+'）';r.append(i,s);l.append(r)})}
function submitWord(){const w=$('#win').value.trim();if(!w)return;pw=w;up({t:'word',w})}
function sendImg(){if($('#pd').hidden)return;clearInterval(tmr);lastImg=cv.toDataURL('image/jpeg',.7);up({t:'img',img:lastImg});
  view('pt','<small>お題「'+esc(pw)+'」</small><b>👀</b><span>みんなが見ています…</span>');timer(0)}
function submitGuess(){const g=$('#gin').value.trim();if(g)up({t:'guess',g})}
function giveUp(){if($('#pg').hidden)return;clearInterval(tmr);up({t:'giveup'});view('pt','<span>けっかをまっています…</span>')}
function wrong(){const e=$('#gin');e.classList.remove('sh');void e.offsetWidth;e.classList.add('sh');e.value='';toast('ちがうみたい！もう一度')}
function showOver(m){clearInterval(tmr);const lo=esc(nm(m.loser)),w=esc(String(m.word||'').slice(0,30)),mine=m.loser==me.id;
  $('#ot').textContent=mine?'😢 まけ…':'🎉 セーフ！';
  $('#orr').innerHTML={giveup:lo+'さんは「'+w+'」を当てられなかった！',n:lo+'さんが「ん」で終わった！',wordtime:lo+'さんがお題の時間切れ',drawtime:lo+'さんが絵の時間切れ'}[m.reason]||'';
  $('#osc').textContent=hist.length+'れんさ';
  const g=$('#gal');g.textContent='';const items=hist.slice();if(m.reason=='giveup'&&lastImg)items.push({word:String(m.word||'').slice(0,30),img:lastImg});
  items.forEach(h=>{const f=document.createElement('figure'),i=document.createElement('img'),c=document.createElement('figcaption');i.src=h.img||'';c.textContent=h.word;f.append(i,c);g.append(f)});
  $('#ov').hidden=false}

/* ---------- お絵かき ---------- */
const cv=$('#cv'),cx=cv.getContext('2d',{willReadFrequently:true});cv.width=cv.height=600;cx.lineCap=cx.lineJoin='round';
let col='#222222',tool='pen',drawing=false,lp,lm,snaps=[],redos=[];
const snap=()=>{snaps.push(cx.getImageData(0,0,600,600));if(snaps.length>20)snaps.shift();redos=[]};
function clr(){cx.fillStyle='#fff';cx.fillRect(0,0,600,600);snaps=[];redos=[]}
function wipe(){snap();cx.fillStyle='#fff';cx.fillRect(0,0,600,600)}
function undo(){const s=snaps.pop();if(s){redos.push(cx.getImageData(0,0,600,600));cx.putImageData(s,0,0)}}
function redo(){const s=redos.pop();if(s){snaps.push(cx.getImageData(0,0,600,600));cx.putImageData(s,0,0)}}
function fill(x,y){const W=600,id=cx.getImageData(0,0,W,W),d=id.data,i0=(y*W+x)*4,tr=d[i0],tg=d[i0+1],tb=d[i0+2],n=parseInt(col.slice(1),16),r=n>>16,g=n>>8&255,b=n&255,T=90;
  const m=i=>Math.abs(d[i]-tr)+Math.abs(d[i+1]-tg)+Math.abs(d[i+2]-tb)<=T;
  if(Math.abs(r-tr)+Math.abs(g-tg)+Math.abs(b-tb)<=T)return false;
  const st=[[x,y]];
  while(st.length){let[px,py]=st.pop();while(px>=0&&m((py*W+px)*4))px--;px++;let u=0,w=0;
    while(px<W&&m((py*W+px)*4)){const j=(py*W+px)*4;d[j]=r;d[j+1]=g;d[j+2]=b;
      if(py>0){const q=m(j-W*4);if(q&&!u){st.push([px,py-1]);u=1}else if(!q)u=0}
      if(py<W-1){const q=m(j+W*4);if(q&&!w){st.push([px,py+1]);w=1}else if(!q)w=0}
      px++}}
  cx.putImageData(id,0,0);return true}
const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*600/r.width,(e.clientY-r.top)*600/r.height]};
const lw=e=>{const s=+$('#sz').value;return e.pointerType=='pen'&&e.pressure?Math.max(1,s*(.3+e.pressure*.9)):s};
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);const p=pt(e);
  if(tool=='fill'){snap();if(!fill(p[0]|0,p[1]|0))snaps.pop();return}
  snap();drawing=true;cx.strokeStyle=cx.fillStyle=tool=='eraser'?'#fff':col;cx.lineWidth=lw(e);lp=lm=p;
  cx.beginPath();cx.arc(p[0],p[1],cx.lineWidth/2,0,7);cx.fill()};
cv.onpointermove=e=>{if(!drawing)return;const p=pt(e),m=[(lp[0]+p[0])/2,(lp[1]+p[1])/2];cx.lineWidth=lw(e);
  cx.beginPath();cx.moveTo(lm[0],lm[1]);cx.quadraticCurveTo(lp[0],lp[1],m[0],m[1]);cx.stroke();lm=m;lp=p};
cv.onpointerup=cv.onpointercancel=()=>{if(drawing){cx.beginPath();cx.moveTo(lm[0],lm[1]);cx.lineTo(lp[0],lp[1]);cx.stroke()}drawing=false};
const pv=()=>{const s=+$('#sz').value,e=$('#szp');$('#szv').textContent=s;e.style.width=e.style.height=Math.max(3,Math.min(s,32))+'px';e.style.background=tool=='eraser'?'#fff':col};
const setCol=c=>{col=c;$('#cpk').value=c;if(tool!='pen')document.querySelector('[data-t=pen]').click();document.querySelectorAll('.dot').forEach(d=>d.classList.toggle('on',d.dataset.c==c));pv()};
document.querySelectorAll('.tb').forEach(b=>b.onclick=()=>{tool=b.dataset.t;document.querySelectorAll('.tb').forEach(x=>x.classList.toggle('on',x===b));cv.style.cursor=tool=='fill'?'cell':'crosshair';pv()});
['#222222','#8e8e93','#ff3b30','#ff9500','#ffcc00','#34c759','#00c7be','#0a84ff','#af52de','#ff2d92','#a2845e','#ffffff'].forEach(c=>{
  const b=document.createElement('button');b.className='dot';b.dataset.c=c;b.style.background=c;b.setAttribute('aria-label','色 '+c);b.onclick=()=>setCol(c);$('#pal').insertBefore(b,$('#cpk'))});
$('#cpk').oninput=e=>setCol(e.target.value);$('#sz').oninput=pv;setCol('#222222');
$('#win').addEventListener('keydown',e=>{if(e.key=='Enter'&&!e.isComposing)submitWord()});
$('#gin').addEventListener('keydown',e=>{if(e.key=='Enter'&&!e.isComposing)submitGuess()});
$('#cin').addEventListener('keydown',e=>{if(e.key=='Enter')join()});
/* キーボードが出たら入力パネルだけをキーボードの真上に浮かせる */
const vv=window.visualViewport;
function kb(){if(!vv)return;const h=Math.max(0,innerHeight-vv.height-vv.offsetTop),a=document.activeElement;
  document.documentElement.style.setProperty('--kb',h+'px');
  const open=h>120&&a&&a.tagName=='INPUT'&&a.closest('#panel');$('#panel').classList.toggle('kb',!!open);if(h>120)scrollTo(0,0)}
if(vv){vv.addEventListener('resize',kb);vv.addEventListener('scroll',kb)}
document.addEventListener('focusout',()=>setTimeout(()=>{kb();scrollTo(0,0)},120));
</script>
</body>
