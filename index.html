<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PMS通信</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f1519;--panel:#172027;--line:#2a3640;--sand:#d6c7a1;--txt:#e9e4d6;--dim:#8d9aa3;--ok:#6fc2b0;--bad:#e0553f;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--ink);color:var(--txt);font:400 15px/1.6 "Zen Kaku Gothic New",system-ui,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 16px;min-height:44px}
button:hover{border-color:var(--sand)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--sand);outline-offset:2px}
button.main{background:var(--sand);color:#1a1710;border-color:var(--sand);font-weight:700}
button.off{background:var(--bad);border-color:var(--bad);color:#fff}
button.on{border-color:var(--ok);color:var(--ok)}
input,select{background:#0b1013;border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-height:44px}
h1{font:700 clamp(40px,9vw,72px)/1.1 "Shippori Mincho B1",serif;color:var(--sand);letter-spacing:.06em}
label{display:block;color:var(--dim);font-size:13px;margin:14px 0 6px}
.hide{display:none!important}
#lobby{min-height:100%;display:grid;align-content:center;max-width:520px;margin:0 auto;padding:28px 20px}
#lobby p.lead{color:var(--dim);margin:12px 0 28px}
.row{display:flex;gap:10px}.row>*{flex:1}.row>input{flex:2}
.or{color:var(--dim);text-align:center;margin:20px 0 0;font-size:13px}
#room{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header b{font:700 22px "Shippori Mincho B1",serif;color:var(--sand);letter-spacing:.08em}
#hud{margin-left:auto;font-size:13px;color:var(--dim)}
#hud i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
#grid{flex:1;overflow:auto;padding:12px;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));align-content:center}
.tile{position:relative;aspect-ratio:16/9;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:grid;place-items:center}
.tile.speaking{outline:3px solid var(--ok);outline-offset:-3px}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.tile.self video{transform:scaleX(-1)}
.tile.screen{grid-column:1/-1;aspect-ratio:16/9;max-height:64vh;justify-self:center;width:100%}
.tile.screen video{object-fit:contain}
.av{font:700 56px "Shippori Mincho B1",serif;color:var(--sand)}
.nm{position:absolute;left:10px;bottom:8px;background:#0009;padding:2px 10px;border-radius:6px;font-size:13px}
.nm.mu::after{content:" ・ミュート";color:var(--bad)}
nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px;border-top:1px solid var(--line)}
dialog{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(440px,92vw);margin:auto}
dialog::backdrop{background:#000a}
.chk{display:flex;gap:10px;align-items:center;margin-top:10px;color:var(--txt)}.chk input{width:auto;min-height:0}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--sand);color:#1a1710;padding:10px 18px;border-radius:8px;font-weight:700;z-index:9}
@media (prefers-reduced-motion:no-preference){.tile{transition:outline-color .1s}}
</style>
</head>
<body>

<section id="lobby">
  <h1>PMS通信</h1>
  <p class="lead">少人数向けの通話・ビデオ・画面共有。映像と音声は端末同士で直接つながり、暗号化されます。</p>
  <label for="name">name</label>
  <input id="name" maxlength="16" placeholder="例:Taro" autocomplete="off">
  <div style="margin-top:20px"><button class="main" id="create" style="width:100%">新しい回線を開く</button></div>
  <p class="or">受け取った回線コードがある場合</p>
  <label for="code">回線コード</label>
  <div class="row"><input id="code" maxlength="8" placeholder="ABC123" autocomplete="off" style="text-transform:uppercase"><button id="join">入る</button></div>
</section>

<section id="room" class="hide">
  <header>
    <b id="rcode"></b>
    <button id="copy">リンクをコピー</button>
    <span id="hud"><i></i>接続待ち</span>
  </header>
  <main id="grid"></main>
  <nav>
    <button id="bMic" class="on">マイク</button>
    <button id="bCam">カメラ</button>
    <button id="bScr">画面共有</button>
    <button id="bLine" class="main">LINEで呼ぶ</button>
    <button id="bSet">設定</button>
    <button id="bLeave" class="off">退出</button>
  </nav>
</section>

<dialog id="dlg">
  <h2 style="font:700 20px 'Shippori Mincho B1',serif;color:var(--sand)">設定</h2>
  <label>マイク</label><select id="sMic"></select>
  <label>カメラ</label><select id="sCam"></select>
  <label>スピーカー</label><select id="sSpk"></select>
  <div class="row">
    <div><label>映像の解像度</label><select id="sRes"><option value="720">720p</option><option value="1080" selected>1080p</option><option value="1440">1440p</option></select></div>
    <div><label>フレームレート</label><select id="sFps"><option>30</option><option>60</option></select></div>
    <div><label>映像の上限</label><select id="sBr"><option value="2000">2 Mbps</option><option value="4000" selected>4 Mbps</option><option value="8000">8 Mbps</option></select></div>
  </div>
  <label class="chk"><input type="checkbox" id="cEcho" checked>エコー除去(ヘッドホン使用時はオフで高音質)</label>
  <label class="chk"><input type="checkbox" id="cNs" checked>ノイズ除去</label>
  <label class="chk"><input type="checkbox" id="cAgc">音量の自動調整</label>
  <div class="row" style="margin-top:20px"><button class="main" id="sOk">適用して閉じる</button></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=s=>document.querySelector(s),PFX='betsuhan-v1-',AL='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const RES={720:[1280,720],1080:[1920,1080],1440:[2560,1440]};
const cfg={mic:'',cam:'',spk:'',res:1080,fps:30,br:4000,echo:true,ns:true,agc:false};
let peer,myId,code,host=false,myName='',peers={},local={mic:null,cam:null,screen:null},muted=false,watch=[],actx;

const toast=t=>{const e=document.createElement('div');e.id='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2600)};
const roomLink=()=>location.origin+location.pathname+'#'+code;
const gen=()=>Array.from({length:6},()=>AL[Math.random()*AL.length|0]).join('');
const audioC=()=>({deviceId:cfg.mic?{exact:cfg.mic}:undefined,echoCancellation:cfg.echo,noiseSuppression:cfg.ns,autoGainControl:cfg.agc,channelCount:1,sampleRate:48000,latency:0.01});

// Opus設定:FEC有効・DTX無効・高ビットレート
function opus(stereo){return sdp=>{const m=sdp.match(/a=rtpmap:(\d+) opus\/48000/);if(!m)return sdp;
  return sdp.replace(new RegExp('a=fmtp:'+m[1]+' .*'),'a=fmtp:'+m[1]+' minptime=10;useinbandfec=1;usedtx=0;stereo='+(stereo?1:0)+';sprop-stereo='+(stereo?1:0)+';maxaveragebitrate='+(stereo?192000:128000)+';maxplaybackrate=48000')}}

async function enter(create){
  myName=$('#name').value.trim()||'名無し';
  code=create?gen():$('#code').value.trim().toUpperCase();
  if(!code)return toast('回線コードを入力してください');
  try{local.mic=await navigator.mediaDevices.getUserMedia({audio:audioC()})}catch(e){return toast('マイクの使用を許可してください')}
  const opt={config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]}};
  host=create;peer=create?new Peer(PFX+code,opt):new Peer(opt);
  peer.on('open',id=>{myId=id;showRoom();if(!create)link(PFX+code)});
  peer.on('connection',onData);
  peer.on('call',onCall);
  peer.on('error',e=>{
    if(e.type==='unavailable-id'&&create){peer.destroy();local.mic.getTracks().forEach(t=>t.stop());return enter(true)}
    if(e.type==='peer-unavailable'){toast('その回線は見つかりません');return leave()}
    if(e.type!=='disconnected')toast('接続エラー:'+e.type)});
}
function showRoom(){
  $('#lobby').classList.add('hide');$('#room').classList.remove('hide');$('#rcode').textContent='回線 '+code;
  history.replaceState(null,'','#'+code);
  const t=mkTile('self',myName+'(自分)');t.el.classList.add('self');watchStream(local.mic,t.el);
}
function link(id){if(peers[id]||id===myId)return;onData(peer.connect(id,{reliable:true}))}
function ensure(id){return peers[id]||(peers[id]={id,name:'…',out:{},inc:{},...mkTile(id,'…')})}
function onData(c){const id=c.peer;
  c.on('open',()=>{const p=ensure(id);p.data=c;c.send({t:'hello',name:myName,mute:muted});['mic','cam','screen'].forEach(k=>local[k]&&callTo(id,k,local[k]))});
  c.on('data',m=>{const p=ensure(id);
    if(m.t==='hello'){p.name=m.name;p.nm.textContent=m.name;p.av.textContent=[...m.name][0];p.nm.classList.toggle('mu',!!m.mute);
      if(host)c.send({t:'roster',ids:Object.keys(peers).filter(x=>x!==id)})}
    if(m.t==='roster')m.ids.forEach(link);
    if(m.t==='st')p.nm.classList.toggle('mu',!!m.mute)});
  c.on('close',()=>drop(id));c.on('error',()=>drop(id));
}
function callTo(id,kind,stream){const p=ensure(id);if(p.out[kind])return;
  const c=peer.call(id,stream,{metadata:{kind},sdpTransform:opus(kind==='screen')});p.out[kind]=c;
  c.on('close',()=>delete p.out[kind]);[600,2500].forEach(d=>setTimeout(()=>tune(c,kind),d))}
function tune(c,kind){try{c.peerConnection.getSenders().forEach(async s=>{if(!s.track)return;
  const q=s.getParameters();if(!q.encodings||!q.encodings.length)q.encodings=[{}];const e=q.encodings[0];
  if(s.track.kind==='audio'){e.maxBitrate=kind==='screen'?192000:128000;e.priority='high';e.networkPriority='high'}
  else{e.maxBitrate=cfg.br*1000*(kind==='screen'?2:1);e.maxFramerate=cfg.fps;q.degradationPreference=kind==='screen'?'maintain-resolution':'maintain-framerate'}
  try{await s.setParameters(q)}catch(_){}})}catch(_){}}
function onCall(c){const kind=c.metadata.kind,p=ensure(c.peer);c.answer(undefined,{sdpTransform:opus(kind==='screen')});p.inc[kind]=c;
  c.on('stream',s=>{try{c.peerConnection.getReceivers().forEach(r=>r.jitterBufferTarget=kind==='mic'?20:0)}catch(_){}
    if(kind==='mic'){const a=new Audio();a.autoplay=true;a.srcObject=s;if(cfg.spk&&a.setSinkId)a.setSinkId(cfg.spk).catch(()=>{});p.audio=a;watchStream(s,p.el)}
    if(kind==='cam'){p.vid.srcObject=s;p.vid.hidden=false}
    if(kind==='screen'){const t=mkTile(c.peer+':s',p.name+' の画面');t.el.classList.add('screen');t.av.remove();t.vid.hidden=false;t.vid.muted=false;t.vid.srcObject=s;p.scr=t.el;$('#grid').prepend(t.el)}});
  c.on('close',()=>{delete p.inc[kind];if(kind==='cam')p.vid.hidden=true;if(kind==='screen'&&p.scr){p.scr.remove();p.scr=null}})}
function drop(id){const p=peers[id];if(!p)return;Object.values(p.out).concat(Object.values(p.inc)).forEach(c=>c.close());
  p.el.remove();p.scr&&p.scr.remove();p.audio&&(p.audio.srcObject=null);delete peers[id]}
function mkTile(id,name){const el=document.createElement('div');el.className='tile';
  el.innerHTML='<video autoplay playsinline muted hidden></video><span class="av"></span><span class="nm"></span>';
  const r={el,vid:el.children[0],av:el.children[1],nm:el.children[2]};r.nm.textContent=name;r.av.textContent=[...name][0]||'?';$('#grid').append(el);
  if(id==='self')peers.self=Object.assign(peers.self||{},r);return r}
function watchStream(s,el){actx=actx||new AudioContext();const an=actx.createAnalyser();an.fftSize=512;actx.createMediaStreamSource(s).connect(an);watch.push({an,el,buf:new Uint8Array(an.fftSize)})}
setInterval(()=>watch.forEach(w=>{w.an.getByteTimeDomainData(w.buf);let m=0;for(const v of w.buf)m=Math.max(m,Math.abs(v-128));w.el.classList.toggle('speaking',m>14&&!(w.el.classList.contains('self')&&muted))}),100);

// 操作
function broadcast(m){Object.values(peers).forEach(p=>p.data&&p.data.open&&p.data.send(m))}
function sendKind(k,s){Object.keys(peers).forEach(id=>id!=='self'&&callTo(id,k,s))}
function stopKind(k){const s=local[k];if(!s)return;s.getTracks().forEach(t=>t.stop());Object.values(peers).forEach(p=>p.out&&p.out[k]&&p.out[k].close());local[k]=null}
$('#bMic').onclick=e=>{muted=!muted;local.mic.getAudioTracks().forEach(t=>t.enabled=!muted);e.target.classList.toggle('off',muted);e.target.classList.toggle('on',!muted);e.target.textContent=muted?'ミュート中':'マイク';peers.self.nm.classList.toggle('mu',muted);broadcast({t:'st',mute:muted})};
async function camOn(){const[w,h]=RES[cfg.res];
  try{local.cam=await navigator.mediaDevices.getUserMedia({video:{deviceId:cfg.cam?{exact:cfg.cam}:undefined,width:{ideal:w},height:{ideal:h},frameRate:{ideal:cfg.fps}}})}catch(e){return toast('カメラを使用できません')}
  local.cam.getVideoTracks()[0].contentHint='motion';const s=peers.self;s.vid.srcObject=local.cam;s.vid.hidden=false;sendKind('cam',local.cam);$('#bCam').classList.add('on')}
function camOff(){stopKind('cam');peers.self.vid.hidden=true;$('#bCam').classList.remove('on')}
$('#bCam').onclick=()=>local.cam?camOff():camOn();
$('#bScr').onclick=async()=>{
  if(local.screen){stopKind('screen');$('#bScr').classList.remove('on');return}
  const[w,h]=RES[cfg.res];
  try{local.screen=await navigator.mediaDevices.getDisplayMedia({video:{width:{ideal:w},height:{ideal:h},frameRate:{ideal:cfg.fps}},audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:2,sampleRate:48000},systemAudio:'include'})}catch(e){return}
  local.screen.getVideoTracks()[0].contentHint='detail';local.screen.getVideoTracks()[0].onended=()=>{stopKind('screen');$('#bScr').classList.remove('on')};
  sendKind('screen',local.screen);$('#bScr').classList.add('on')};
$('#bLine').onclick=()=>{const t='【PMS通信】回線コード '+code+' に入ってください\n'+roomLink();
  if(location.protocol==='file:')toast('リンクを使うにはWebに公開して開いてください');
  window.open('https://line.me/R/share?text='+encodeURIComponent(t),'_blank')};
$('#copy').onclick=()=>navigator.clipboard.writeText(roomLink()).then(()=>toast('リンクをコピーしました'));
function leave(){Object.keys(peers).forEach(id=>id!=='self'&&drop(id));['mic','cam','screen'].forEach(stopKind);peer&&peer.destroy();location.hash='';location.reload()}
$('#bLeave').onclick=leave;

// 設定
$('#bSet').onclick=async()=>{const d=await navigator.mediaDevices.enumerateDevices();
  const fill=(id,kind,cur)=>{$(id).innerHTML='<option value="">既定</option>'+d.filter(x=>x.kind===kind).map(x=>`<option value="${x.deviceId}"${x.deviceId===cur?' selected':''}>${x.label||kind}</option>`).join('')};
  fill('#sMic','audioinput',cfg.mic);fill('#sCam','videoinput',cfg.cam);fill('#sSpk','audiooutput',cfg.spk);$('#dlg').showModal()};
$('#sOk').onclick=async()=>{Object.assign(cfg,{mic:$('#sMic').value,cam:$('#sCam').value,spk:$('#sSpk').value,res:+$('#sRes').value,fps:+$('#sFps').value,br:+$('#sBr').value,echo:$('#cEcho').checked,ns:$('#cNs').checked,agc:$('#cAgc').checked});
  $('#dlg').close();
  try{const n=await navigator.mediaDevices.getUserMedia({audio:audioC()});const nt=n.getAudioTracks()[0];nt.enabled=!muted;
    Object.values(peers).forEach(p=>p.out&&p.out.mic&&p.out.mic.peerConnection.getSenders().forEach(s=>s.track&&s.track.kind==='audio'&&s.replaceTrack(nt)));
    local.mic.getTracks().forEach(t=>t.stop());local.mic=n;watchStream(n,peers.self.el)}catch(e){toast('マイクを切り替えられません')}
  Object.values(peers).forEach(p=>p.audio&&p.audio.setSinkId&&cfg.spk&&p.audio.setSinkId(cfg.spk).catch(()=>{}));
  if(local.cam){camOff();camOn()}};

// 回線状態(遅延・パケットロス)
setInterval(async()=>{let rtt=null,loss=0;
  for(const p of Object.values(peers)){const c=p.out&&p.out.mic;if(!c||!c.peerConnection)continue;
    (await c.peerConnection.getStats()).forEach(r=>{if(r.type==='candidate-pair'&&r.nominated&&r.currentRoundTripTime!=null)rtt=Math.max(rtt||0,r.currentRoundTripTime*1000);
      if(r.type==='remote-inbound-rtp'&&r.kind==='audio'&&r.fractionLost!=null)loss=Math.max(loss,r.fractionLost*100)})}
  const h=$('#hud');if(rtt===null){h.innerHTML='<i></i>相手を待っています';return}
  const bad=rtt>150||loss>5;h.innerHTML=`<i style="background:${bad?'var(--bad)':'var(--ok)'}"></i>遅延 ${rtt.toFixed(0)}ms ・ 損失 ${loss.toFixed(1)}%`},2000);

$('#create').onclick=()=>enter(true);$('#join').onclick=()=>enter(false);
if(location.hash.length>1){$('#code').value=location.hash.slice(1).toUpperCase();$('#name').focus()}
</script>
</body>
</html>
