<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MILITARY TRANSCEIVER - AN/PRC-100 HI-FI</title>
<script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
:root{--bg:#0f120e;--panel:#232a20;--bd:#3b4737;--dark:#151a13;--green:#00ff66;--amber:#ffb300;--red:#ff3333;--tx:#d0ded0;--mute:#6b7a67}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
body{background:var(--bg);color:var(--tx);font-family:'Courier New',monospace;height:100dvh;width:100vw;overflow:hidden;display:flex;justify-content:center}
.app{width:100%;height:100%;max-width:500px;display:flex;flex-direction:column;background:var(--panel);border:0 solid var(--bd);border-width:0 2px;box-shadow:0 0 30px #000}
.header{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;background:var(--dark);border-bottom:2px solid var(--bd);letter-spacing:1px;flex-shrink:0}
.header h1{font-size:1rem;display:flex;align-items:center;gap:6px}
.st{display:flex;align-items:center;gap:10px}
#user-count{font-size:.85rem;color:var(--amber);font-weight:bold}
#quality{font-size:.65rem;color:var(--green);border:1px solid var(--green);padding:1px 5px;border-radius:3px;opacity:.4}
#quality.on{opacity:1}
.dot{width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid #000;box-shadow:0 0 4px var(--red);transition:.3s}
.dot.on{background:var(--green);box-shadow:0 0 10px var(--green)}
.display{padding:8px 14px;background:#080a07;border-bottom:2px solid var(--bd);position:relative;height:176px;flex-shrink:0;display:flex;align-items:center}
canvas{width:100%;height:160px;background:#050d05;border:2px solid #2a3826;border-radius:4px;box-shadow:inset 0 0 15px rgba(0,255,102,.15)}
.scope{position:absolute;top:14px;bottom:14px;left:20px;font-size:.65rem;font-weight:bold;opacity:.75;letter-spacing:2px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.rx{color:var(--green)}.tx{color:var(--amber)}
.controls{padding:14px 16px;display:flex;flex-direction:column;gap:12px;flex-shrink:0}
.freq{background:var(--dark);padding:10px 12px;border:2px solid var(--bd);border-radius:4px;display:flex;flex-direction:column;gap:6px}
.freq-h{display:flex;justify-content:space-between;font-size:.75rem;color:var(--mute);font-weight:bold}
.adj{display:flex;gap:10px;align-items:center}
.btn-sm{background:#1a2118;border:1px solid var(--bd);color:var(--tx);width:44px;height:44px;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #000}
.btn-sm:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.sel{flex:1;display:flex;align-items:center;background:#000;padding:4px 12px;border:1px solid var(--bd);height:44px}
.sel input{width:100%;background:transparent;border:none;color:var(--amber);font-size:1.6rem;font-family:inherit;font-weight:bold;text-align:center;outline:none;-moz-appearance:textfield}
.sel input::-webkit-outer-spin-button,.sel input::-webkit-inner-spin-button{-webkit-appearance:none}
.bg{display:flex;gap:10px}
.btn{flex:1;padding:12px;border:2px solid #1a1a1a;border-radius:4px;font-size:.95rem;font-weight:bold;font-family:inherit;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 3px 0 #000}
.btn-c{background:#384d31}.btn-c.active{background:#2e7d32;border-color:var(--green)}.btn-d{background:#4a3333}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #000}
.btn:disabled,.ptt:disabled,.hf:disabled{background:#222621;color:#4d544c;border-color:#1a1d19;box-shadow:none;cursor:not-allowed;transform:none}
.ptt-c{padding:14px 16px 20px;display:flex;background:var(--dark);border-top:2px solid var(--bd);flex:1;min-height:100px}
.pw{display:flex;gap:12px;width:100%}
.ptt{flex:1;min-height:90px;border-radius:8px;background:linear-gradient(180deg,#4a5d35,#2f3d20);border:6px solid #1a1d18;box-shadow:0 6px 0 #0d0f0c,inset 0 3px 8px rgba(255,255,255,.15);color:#fff;font-size:1.2rem;font-weight:bold;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;text-shadow:0 2px 2px #000;letter-spacing:2px;touch-action:none}
.ptt .material-icons{font-size:3rem}
.ptt.active{transform:translateY(6px);box-shadow:inset 0 6px 12px rgba(0,0,0,.7);background:linear-gradient(180deg,#384728,#1d2613);color:var(--amber)}
.hf{width:70px;border-radius:8px;background:linear-gradient(180deg,#3a3f36,#1f221c);border:5px solid #151713;box-shadow:0 5px 0 #0d0f0c;color:var(--mute);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hf .material-icons{font-size:2.2rem}.hf .l{font-size:.6rem;font-weight:bold;letter-spacing:1px}
.hf.active{background:linear-gradient(180deg,#b37d00,#805900);color:#fff;box-shadow:inset 0 5px 10px rgba(0,0,0,.8);transform:translateY(5px);border-color:#332400}
#toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:9999;pointer-events:none;width:320px;max-width:calc(100vw - 32px)}
.toast{background:rgba(18,24,16,.95);padding:12px 16px;border-radius:4px;border:1px solid var(--bd);border-left:5px solid var(--amber);font-size:.9rem;animation:in .3s,out .3s 2.7s forwards;display:flex;gap:10px;align-items:center}
.toast.error{border-left-color:var(--red)}
@keyframes in{from{opacity:0;transform:translateY(-20px)}}
@keyframes out{to{opacity:0}}
</style>
</head>
<body>
<div id="toasts"></div>
<div class="app">
  <div class="header">
    <h1><span class="material-icons" style="font-size:1.2rem;color:var(--amber)">radar</span> AN/PRC-100 COMM</h1>
    <div class="st"><span id="quality">OPUS 128k</span><span id="user-count">USERS: 0</span><div id="dot" class="dot"></div></div>
  </div>
  <div class="display">
    <div class="scope"><div class="rx">RX (相手)</div><div class="tx">TX (自分)</div></div>
    <canvas id="wave"></canvas>
  </div>
  <div class="controls">
    <div class="freq">
      <div class="freq-h"><span>FREQUENCY CONTROL</span><span style="color:var(--amber)">MHz</span></div>
      <div class="adj">
        <button id="fd" class="btn-sm"><span class="material-icons">remove</span></button>
        <div class="sel"><span class="material-icons" style="color:var(--mute);font-size:1.3rem">tune</span><input type="number" id="freq" min="1" max="10000" value="1234"></div>
        <button id="fu" class="btn-sm"><span class="material-icons">add</span></button>
      </div>
    </div>
    <div class="bg">
      <button id="bc" class="btn btn-c"><span class="material-icons">settings_input_antenna</span> 接続</button>
      <button id="bd" class="btn btn-d" disabled><span class="material-icons">power_off</span> 切断</button>
    </div>
  </div>
  <div class="ptt-c"><div class="pw">
    <button id="ptt" class="ptt" disabled><span class="material-icons">mic</span>PUSH TO TALK</button>
    <button id="hf" class="hf" disabled title="常時送信(ハンズフリー)"><span class="material-icons">lock</span><span class="l">LOCK</span></button>
  </div></div>
</div>

<script>
const PREFIX = "nanj-radio-mesh-v2-freq-";

/* ===== 音質設定 ===== */
const AUDIO = {
  bitrate: 128000,   // Opus 上限 (モノラル音声は128kbpsでほぼ透過)
  jitterMs: 40,      // 受信ジッタバッファ目標(ms)。小さいほど低遅延
};

let peer = null, txStream = null, rawStream = null;
let isHandsFree = false, pttHeld = false, connected = false;
const peers = new Map(); // id -> {data, call, src, el}

let ctx = null, txGate, txAnalyser, rxBus, rxAnalyser, rxData, txData, raf = null;
const $ = id => document.getElementById(id);
const canvas = $('wave'), c2 = canvas.getContext('2d');
const freqInput = $('freq'), bc = $('bc'), bd = $('bd'), ptt = $('ptt'), hf = $('hf');

/* ===== Opus SDP チューニング(送受信双方で適用) ===== */
function tuneSdp(sdp) {
  const m = sdp.match(/a=rtpmap:(\d+) opus\/48000\/2/);
  if (!m) return sdp;
  const pt = m[1];
  const params = 'minptime=10;useinbandfec=1;usedtx=0;cbr=0;stereo=0;sprop-stereo=0;' +
    'maxaveragebitrate=' + AUDIO.bitrate + ';maxplaybackrate=48000;sprop-maxcapturerate=48000';
  const re = new RegExp('a=fmtp:' + pt + ' .*');
  return re.test(sdp) ? sdp.replace(re, 'a=fmtp:' + pt + ' ' + params)
                      : sdp.replace(m[0], m[0] + '\r\na=fmtp:' + pt + ' ' + params);
}

/* 送信ビットレート固定・優先度UP・受信ジッタバッファ最小化 */
function tuneRtc(pc) {
  if (!pc) return;
  pc.getSenders().forEach(s => {
    if (!s.track || s.track.kind !== 'audio') return;
    const p = s.getParameters();
    if (!p.encodings || !p.encodings.length) p.encodings = [{}];
    p.encodings[0].maxBitrate = AUDIO.bitrate;
    p.encodings[0].priority = 'high';
    p.encodings[0].networkPriority = 'high';
    s.setParameters(p).catch(() => {});
  });
  pc.getReceivers().forEach(r => {
    try {
      if ('jitterBufferTarget' in r) r.jitterBufferTarget = AUDIO.jitterMs;
      else if ('playoutDelayHint' in r) r.playoutDelayHint = AUDIO.jitterMs / 1000;
    } catch (e) {}
  });
}

/* ===== オーディオ処理チェーン ===== */
function node(type, set) { const n = ctx.createDynamicsCompressor(); return n; }

async function initAudio() {
  if (txStream) { if (ctx.state === 'suspended') ctx.resume(); return true; }
  try {
    rawStream = await navigator.mediaDevices.getUserMedia({ audio: {
      echoCancellation: true, noiseSuppression: true, autoGainControl: true,
      channelCount: 1, sampleRate: 48000, sampleSize: 16, latency: 0.01
    }, video: false });
  } catch (e) { toast("マイクアクセスの許可が必要です", true); return false; }

  ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000, latencyHint: 'interactive' });
  if (ctx.state === 'suspended') await ctx.resume();

  // --- 送信: マイク → HPF → 明瞭度EQ → コンプ → リミッタ → ゲート(PTT) → 送信 ---
  const src = ctx.createMediaStreamSource(rawStream);
  const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 80; hp.Q.value = 0.7;
  const pres = ctx.createBiquadFilter(); pres.type = 'peaking'; pres.frequency.value = 3200; pres.Q.value = 0.9; pres.gain.value = 2;
  const air = ctx.createBiquadFilter(); air.type = 'highshelf'; air.frequency.value = 9000; air.gain.value = 1.5;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -26; comp.knee.value = 18; comp.ratio.value = 3; comp.attack.value = 0.005; comp.release.value = 0.16;
  const makeup = ctx.createGain(); makeup.gain.value = 1.4;
  const lim = ctx.createDynamicsCompressor();
  lim.threshold.value = -3; lim.knee.value = 0; lim.ratio.value = 20; lim.attack.value = 0.001; lim.release.value = 0.05;
  txGate = ctx.createGain(); txGate.gain.value = 0;
  txAnalyser = ctx.createAnalyser(); txAnalyser.fftSize = 1024;
  const dest = ctx.createMediaStreamDestination();
  src.connect(hp); hp.connect(pres); pres.connect(air); air.connect(comp); comp.connect(makeup);
  makeup.connect(lim); lim.connect(txGate); txGate.connect(txAnalyser); txGate.connect(dest);
  txStream = dest.stream;
  txStream.getAudioTracks().forEach(t => { if ('contentHint' in t) t.contentHint = 'speech'; });

  // --- 受信: 全員をミックス → ソフトリミッタ → 出力 ---
  rxBus = ctx.createGain(); rxBus.gain.value = 1;
  const rxLim = ctx.createDynamicsCompressor();
  rxLim.threshold.value = -6; rxLim.knee.value = 6; rxLim.ratio.value = 12; rxLim.attack.value = 0.003; rxLim.release.value = 0.1;
  rxAnalyser = ctx.createAnalyser(); rxAnalyser.fftSize = 1024;
  rxBus.connect(rxLim); rxLim.connect(rxAnalyser); rxAnalyser.connect(ctx.destination);
  rxData = new Uint8Array(rxAnalyser.fftSize); txData = new Uint8Array(txAnalyser.fftSize);
  if (!raf) draw();
  return true;
}

function setTx(on) { if (txGate) txGate.gain.setTargetAtTime(on ? 1 : 0, ctx.currentTime, 0.012); }

function attachRemote(id, stream) {
  const e = peers.get(id); if (!e || e.src) return;
  // Chrome対策: MediaStreamをメディア要素に接続しないとWebAudioに流れない(ミュートで無音再生)
  e.el = new Audio(); e.el.srcObject = stream; e.el.muted = true; e.el.play().catch(() => {});
  e.src = ctx.createMediaStreamSource(stream);
  e.src.connect(rxBus);
}

/* ===== メッシュ接続 ===== */
function ensure(id) { if (!peers.has(id)) peers.set(id, {}); return peers.get(id); }

function setupData(conn) {
  const id = conn.peer, e = ensure(id);
  if (e.data && e.data !== conn) { try { e.data.close(); } catch (x) {} }
  e.data = conn;
  const ready = () => { conn.send({ type: 'peers', list: [...peers.keys()].filter(k => k !== id) }); updateCount(); };
  conn.open ? ready() : conn.on('open', ready);
  conn.on('data', m => {
    if (m && m.type === 'peers') m.list.forEach(p => { if (p !== peer.id && !peers.has(p)) connectTo(p); });
  });
  conn.on('close', () => removePeer(id));
  conn.on('error', () => removePeer(id));
}

function setupCall(call) {
  const id = call.peer, e = ensure(id);
  e.call = call;
  call.on('stream', s => { attachRemote(id, s); tuneRtc(call.peerConnection); setTimeout(() => tuneRtc(call.peerConnection), 1500); updateCount(); });
  call.on('close', () => removePeer(id));
  call.on('error', () => removePeer(id));
}

function connectTo(id) {
  ensure(id);
  setupData(peer.connect(id, { reliable: true }));
  setupCall(peer.call(id, txStream, { sdpTransform: tuneSdp }));
}

function removePeer(id) {
  const e = peers.get(id); if (!e) return;
  peers.delete(id);
  try { e.src && e.src.disconnect(); } catch (x) {}
  if (e.el) { e.el.srcObject = null; }
  try { e.call && e.call.close(); } catch (x) {}
  try { e.data && e.data.close(); } catch (x) {}
  updateCount();
}

function bindPeer() {
  peer.on('connection', conn => setupData(conn));
  peer.on('call', call => { call.answer(txStream, { sdpTransform: tuneSdp }); setupCall(call); });
}

function connectToMesh(hostId) {
  if (peer) peer.destroy();
  peer = new Peer();
  let joined = false;
  peer.on('open', () => {
    bindPeer();
    const dc = peer.connect(hostId, { reliable: true });
    ensure(hostId);
    dc.on('open', () => {
      joined = true;
      toast("周波数 " + freqInput.value + " MHz に同期しました");
      uiConnected();
      setupData(dc);
      setupCall(peer.call(hostId, txStream, { sdpTransform: tuneSdp }));
    });
  });
  peer.on('error', err => {
    if (err.type === 'peer-unavailable' && !joined) { peers.delete(hostId); becomeHost(hostId); }
    else if (!joined || err.type === 'network') { toast("接続エラー: " + err.type, true); resetUI(); }
  });
}

function becomeHost(hostId) {
  if (peer) peer.destroy();
  peer = new Peer(hostId);
  peer.on('open', () => { bindPeer(); toast("周波数 " + freqInput.value + " MHz を開設しました"); uiConnected(); });
  peer.on('error', err => {
    if (err.type === 'unavailable-id') setTimeout(() => connectToMesh(hostId), 400 + Math.random() * 600); // 同時開設の競合
    else { toast("接続エラー: " + err.type, true); resetUI(); }
  });
}

/* ===== UI ===== */
function toast(msg, err) {
  const t = $('toasts'); while (t.children.length >= 3) t.firstChild.remove();
  const d = document.createElement('div'); d.className = 'toast' + (err ? ' error' : '');
  d.innerHTML = `<span class="material-icons" style="font-size:1.2rem">${err ? 'warning' : 'radar'}</span> ${msg}`;
  t.appendChild(d); setTimeout(() => d.remove(), 3000);
}
function updateCount() { $('user-count').textContent = 'USERS: ' + (connected ? peers.size + 1 : 0); }
function uiConnected() {
  connected = true; $('dot').classList.add('on'); $('quality').classList.add('on');
  bc.disabled = true; bc.classList.add('active'); bd.disabled = false; ptt.disabled = false; hf.disabled = false;
  freqInput.disabled = $('fd').disabled = $('fu').disabled = true; updateCount();
}
function resetUI() {
  connected = false; isHandsFree = false; pttHeld = false; setTx(false);
  [...peers.keys()].forEach(removePeer);
  if (peer) { peer.destroy(); peer = null; }
  $('dot').classList.remove('on'); $('quality').classList.remove('on');
  bc.disabled = false; bc.classList.remove('active'); bd.disabled = true; ptt.disabled = true; hf.disabled = true;
  ptt.classList.remove('active'); hf.classList.remove('active');
  freqInput.disabled = $('fd').disabled = $('fu').disabled = false; updateCount();
}

function setFreq(v) { let n = parseInt(v, 10); if (isNaN(n) || n < 1) n = 1; if (n > 10000) n = 10000; freqInput.value = n; }
freqInput.addEventListener('change', e => setFreq(e.target.value));
$('fd').onclick = () => setFreq(+freqInput.value - 1);
$('fu').onclick = () => setFreq(+freqInput.value + 1);

bc.onclick = async () => {
  const f = parseInt(freqInput.value, 10);
  bc.disabled = true; toast("回線を初期化中...");
  if (!(await initAudio())) { bc.disabled = false; return; }
  localStorage.setItem('transceiver_freq', f);
  connectToMesh(PREFIX + f);
};
bd.onclick = () => { resetUI(); toast("回線を切断しました"); };

const press = () => { pttHeld = true; ptt.classList.add('active'); setTx(true); };
const release = () => { if (!pttHeld) return; pttHeld = false; ptt.classList.remove('active'); setTx(isHandsFree); };
ptt.addEventListener('pointerdown', e => { e.preventDefault(); ptt.setPointerCapture(e.pointerId); press(); });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => ptt.addEventListener(ev, release));
hf.onclick = () => {
  isHandsFree = !isHandsFree; hf.classList.toggle('active', isHandsFree);
  setTx(isHandsFree || pttHeld); toast(isHandsFree ? "常時送信 ON" : "常時送信 OFF");
};
window.addEventListener('keydown', e => { if (e.code === 'Space' && !e.repeat && connected && e.target !== freqInput) { e.preventDefault(); press(); } });
window.addEventListener('keyup', e => { if (e.code === 'Space') release(); });
window.addEventListener('beforeunload', () => { if (peer) peer.destroy(); });

/* ===== 波形表示 ===== */
function resize() { canvas.width = canvas.parentElement.clientWidth - 28; canvas.height = 160; }
function trace(an, buf, yMid, amp, color) {
  c2.strokeStyle = color; c2.lineWidth = 1.5; c2.beginPath();
  if (an) an.getByteTimeDomainData(buf);
  const n = buf ? buf.length : 2;
  for (let i = 0; i < n; i++) {
    const x = i / (n - 1) * canvas.width;
    const y = yMid + (an ? (buf[i] - 128) / 128 : 0) * amp;
    i ? c2.lineTo(x, y) : c2.moveTo(x, y);
  }
  c2.stroke();
}
function draw() {
  raf = requestAnimationFrame(draw);
  c2.fillStyle = '#050d05'; c2.fillRect(0, 0, canvas.width, canvas.height);
  c2.strokeStyle = 'rgba(0,255,102,.08)'; c2.lineWidth = 1;
  for (let y = 0; y <= 160; y += 40) { c2.beginPath(); c2.moveTo(0, y); c2.lineTo(canvas.width, y); c2.stroke(); }
  trace(rxAnalyser, rxData, 40, 70, '#00ff66');
  trace(txAnalyser, txData, 120, 70, '#ffb300');
}
window.addEventListener('DOMContentLoaded', () => {
  resize(); window.addEventListener('resize', resize);
  setFreq(localStorage.getItem('transceiver_freq') || 1234);
  trace(null, null, 40, 0, '#00ff66'); trace(null, null, 120, 0, '#ffb300'); updateCount();
});
  
/* ===== プッシュ通知の準備 ===== */
if ("serviceWorker" in navigator && "PushManager" in window) {
  navigator.serviceWorker.register("./sw.js")
    .then(() => console.log("通知機能の準備OK"))
    .catch(err => console.error("通知準備エラー", err));
}

</script>
</body>
</html>
