<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PuchigoMassageService</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--ink:#0f1519;--panel:#172027;--line:#2a3640;--sand:#d6c7a1;--txt:#e9e4d6;--dim:#8d9aa3;--ok:#6fc2b0;--bad:#e0553f;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--ink);color:var(--txt);font:400 15px/1.6 "Zen Kaku Gothic New",system-ui,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 16px;min-height:44px}
button:hover{border-color:var(--sand)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--sand);outline-offset:2px}
button.main{background:var(--sand);color:var(--on,#1a1710);border-color:var(--sand);font-weight:700}
button.off{background:var(--bad);border-color:var(--bad);color:#fff}
button.on{border-color:var(--ok);color:var(--ok)}
input,select{background:#0b1013;border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-height:44px}
h1{font:700 min(31px,5.4vw)/1.2 "Shippori Mincho B1",serif;color:var(--sand);letter-spacing:.02em;white-space:nowrap}
h1 b{font-size:2.1em;font-weight:700;line-height:1}
label{display:block;color:var(--dim);font-size:13px;margin:14px 0 6px}
.hide{display:none!important}
#lobby{min-height:100%;display:grid;align-content:center;max-width:520px;margin:0 auto;padding:28px 20px}
#lobby p.lead{color:var(--dim);margin:12px 0 28px}
.row{display:flex;gap:10px}.row>*{flex:1}.row>input{flex:2}
.or{color:var(--dim);text-align:center;margin:20px 0 0;font-size:13px}
#room{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header b{font:700 22px "Shippori Mincho B1",serif;color:var(--sand);letter-spacing:.08em}
#hud{margin-left:auto;font-size:13px;color:var(--dim)}
#hud i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
#grid{flex:1;overflow:auto;padding:12px;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));align-content:center}
.tile{position:relative;aspect-ratio:16/9;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:grid;place-items:center}
.tile{cursor:pointer}
.tile.speaking{border-color:var(--c,var(--ok));box-shadow:0 0 0 3px var(--c,var(--ok)),0 0 30px 6px color-mix(in srgb,var(--c,var(--ok)) 65%,transparent)}
.tile.speaking .nm{background:var(--c,var(--ok));color:var(--on,#0a1a16);font-weight:700}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.tile.self.mir video{transform:scaleX(-1)}
.tile.screen{grid-column:1/-1;aspect-ratio:16/9;max-height:64vh;justify-self:center;width:100%}
.tile.screen video{object-fit:contain}
.av{font:700 56px "Shippori Mincho B1",serif;color:var(--sand)}
.nm{position:absolute;left:10px;bottom:8px;background:#0009;padding:2px 10px;border-radius:6px;font-size:13px}
.nm.mu::after{content:" ・ミュート";color:var(--bad)}
nav{display:flex;flex-wrap:nowrap;gap:6px;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.cb{flex:1 1 0;min-width:0;max-width:78px;height:72px;padding:6px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;white-space:nowrap;overflow:hidden;font-size:10px;line-height:1;letter-spacing:0}
.cb svg{width:30px;height:30px;fill:currentColor;stroke:none;flex:none}
.cb .sl{display:none;stroke:currentColor;stroke-width:2.5}
.cb.x .sl{display:block}
.cb.on{background:#6fc2b01f}
.zb,.fs{position:absolute;top:8px;z-index:2;min-height:0;height:28px;padding:0;font-size:12px;line-height:26px;background:#000a;border:1px solid #fff3;border-radius:6px;white-space:nowrap;text-align:center;color:var(--txt)}
.zb{right:8px;width:52px}.fs{right:66px;width:64px}
.zb::before{content:'拡大'}.tile.big .zb::before{content:'縮小'}
.tile.map{grid-column:1/-1;aspect-ratio:16/9;max-height:50vh;justify-self:center;width:100%;cursor:default}
.mp{position:absolute;inset:0;background:#0b1013;isolation:isolate}
.mp .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}
.leaflet-tooltip{background:var(--ink);color:var(--txt);border:1px solid var(--sand);box-shadow:none;font:700 12px "Zen Kaku Gothic New",sans-serif}
.leaflet-tooltip-top:before{border-top-color:var(--sand)}
.nm.lc::before{content:"● ";color:var(--c,var(--ok))}
.sws{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:36px;height:36px;min-height:0;padding:0;border-radius:50%;border:3px solid var(--line)}
.sw.sel{border-color:#fff}
.swc{width:48px!important;height:36px;min-height:0!important;padding:2px!important}
.fl{position:absolute;top:8px;left:8px;z-index:2;min-height:0;height:28px;width:84px;padding:0;font-size:12px;line-height:26px;text-align:center;background:#000a;border:1px solid #fff3;border-radius:6px;white-space:nowrap;color:var(--txt);display:none}
.tile.camon .fl{display:block}
#grid.focus .tile:not(.big) .fl{display:none}
nav{gap:4px}
#locbar{margin:8px 12px 0;display:flex;align-items:center;gap:10px;width:calc(100% - 24px);min-height:44px;text-align:left;border-color:var(--ok)}
#locbar i{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
#locbar span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#locbar b{color:var(--dim);font-weight:400;font-size:20px;line-height:1}
.tile.map:not(.big){display:none}
.tile.map.big .zb::before{content:'通話に戻る'}
.tile.map .zb{width:84px}.tile.map .fs{right:100px}
#room.mapmode .cb{height:44px}
#room.mapmode .cb span{display:none}
#room.mapmode .cb svg{width:20px;height:20px}
#room.mapmode nav{padding-top:4px;padding-bottom:calc(4px + env(safe-area-inset-bottom))}
.pl{position:absolute;left:8px;bottom:26px;z-index:5;min-height:0;height:36px;width:104px;padding:0;font-size:13px;white-space:nowrap;background:var(--ink);border-color:var(--sand)}
.plist{position:absolute;left:8px;bottom:68px;z-index:5;width:min(280px,calc(100% - 16px));max-height:55%;overflow:auto;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:4px}
.pr{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:4px 10px;border:0;background:transparent;text-align:left}
.pr:hover{background:var(--panel)}
.pr i{width:12px;height:12px;border-radius:50%;flex:none}
.pr span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr b{color:var(--dim);font-weight:400;font-size:12px;white-space:nowrap}
.tabs{display:flex;gap:6px;margin:12px 0}
.tab{flex:1}
.tab.on{background:var(--sand);color:var(--on,#1a1710);border-color:var(--sand);font-weight:700}
.bshare{position:sticky;bottom:-20px;background:var(--panel);border-top:1px solid var(--line);margin-top:14px;padding:10px 0 4px}
#ysr{max-height:min(260px,36vh);overflow:auto;overscroll-behavior:contain;border:1px solid var(--line);border-radius:10px;padding:2px 6px 6px;margin-top:10px}
#ysr:empty{display:none}
#dBgm{max-height:88vh;overflow:auto}
.lr{display:flex;gap:6px;margin-top:6px}
.lr button{min-height:44px}
.lp{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ls,.lx{width:44px;padding:0;flex:none}
.ls.on{color:var(--sand);border-color:var(--sand)}
.sr{display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin-top:6px;padding:6px}
.sr img{width:96px;height:54px;object-fit:cover;border-radius:6px;flex:none;background:#000}
.sr div{min-width:0}
.sr b{font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sr span{color:var(--dim);font-size:12px}
#ver{position:fixed;top:calc(env(safe-area-inset-top) + 3px);left:10px;z-index:20;font-size:11px;line-height:1;color:var(--dim);pointer-events:none;letter-spacing:.04em}
#room{padding-top:16px}
#grid.focus{display:flex;flex-wrap:wrap;align-content:flex-start;overflow:auto}
#grid.focus .tile.big{order:-1;flex:1 0 100%;width:100%;height:calc(100% - 100px);min-height:200px;aspect-ratio:auto;max-height:none}
#grid.focus .big video{object-fit:contain}
#grid.focus .tile:not(.big){flex:0 0 150px;width:150px;height:90px;aspect-ratio:auto;max-height:none}
#grid.focus .tile:not(.big) .av{font-size:28px}
#grid.focus .tile:not(.big) .nm{font-size:11px;left:6px;bottom:5px;padding:1px 6px}
#grid.focus .tile:not(.big) .zb,#grid.focus .tile:not(.big) .fs{display:none}
dialog{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(440px,92vw);margin:auto}
dialog::backdrop{background:#000a}
.chk{display:flex;gap:10px;align-items:center;margin-top:10px;color:var(--txt)}.chk input{width:auto;min-height:0}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--sand);color:var(--on,#1a1710);padding:10px 18px;border-radius:8px;font-weight:700;z-index:9}
@media (prefers-reduced-motion:no-preference){.tile{transition:box-shadow .12s}}
</style>
</head>
<body>
<div id="ver">Ver.26.10.2</div>

<section id="lobby">
  <h1><b>P</b>uchigo<b>M</b>assage<b>S</b>ervice</h1>
  <p class="lead">少人数向けの通話・ビデオ・画面共有。映像と音声は端末同士で直接つながり、暗号化されます。</p>
  <label for="name">name</label>
  <input id="name" maxlength="16" placeholder="例:Taro" autocomplete="off">
  <label>テーマカラー(文字や地図の自分の色になります)</label>
  <div class="sws" id="sw1"></div>
  <label for="rid">回線ID(空欄なら自動で決まります)</label>
  <input id="rid" maxlength="16" placeholder="例:MY-ROOM" autocomplete="off" style="text-transform:uppercase">
  <div style="margin-top:20px"><button class="main" id="create" style="width:100%">新しい回線を開く</button></div>
  <p class="or">受け取った回線コードがある場合</p>
  <label for="code">回線コード</label>
  <div class="row"><input id="code" maxlength="16" placeholder="ABC123" autocomplete="off" style="text-transform:uppercase"><button id="join">入る</button></div>
</section>

<section id="room" class="hide">
  <header>
    <b id="rcode"></b>
    <button id="copy">リンクをコピー</button>
    <button id="bBgm" type="button">♪ BGM</button>
    <span id="hud"><i></i>接続待ち</span>
  </header>
  <button id="locbar" class="hide" type="button" aria-label="位置情報の地図を開く"><i></i><span>位置情報は共有されています</span><b>›</b></button>
  <main id="grid"></main>
  <nav>
    <button class="cb on" id="bMic" aria-label="マイクのオン・オフ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z"/><line class="sl" x1="4" y1="4" x2="20" y2="20"/></svg><span>マイク</span></button>
    <button class="cb x" id="bCam" aria-label="カメラのオン・オフ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h12a1 1 0 0 1 1 1v3.500l5-3v9l-5-3V17a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z"/><line class="sl" x1="4" y1="4" x2="20" y2="20"/></svg><span>カメラ</span></button>
    <button class="cb" id="bScr" aria-label="画面共有の開始・停止"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1h-7v2h3v2H7v-2h3v-2H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm1 2v9h16V6H4z"/></svg><span>画面共有</span></button>
    <button class="cb x" id="bLoc" aria-label="現在地の共有をオン・オフ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.500A2.500 2.500 0 1 1 12 6.500a2.500 2.500 0 0 1 0 5z"/><line class="sl" x1="4" y1="4" x2="20" y2="20"/></svg><span>位置共有</span></button>
    <button class="cb main" id="bLine" aria-label="LINEで友達を呼ぶ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1h-9l-5 4v-4H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/></svg><span>LINE招待</span></button>
    <button class="cb" id="bSet" aria-label="設定"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10V5h2v2h4v2h-4v2h-2V9H4V7zm0 8h4v-2h2v2h10v2H10v2H8v-2H4v-2z"/></svg><span>設定</span></button>
    <button class="cb off" id="bLeave" aria-label="退出"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8c-3 0-5.800 1-8 2.800-.5.500-.5 1.300 0 1.800l1.500 1.500c.4.400 1 .5 1.500.2l2-1.200c.3-.2.5-.5.5-.9V10c1-.3 2-.5 3-.5s2 .2 3 .5v1.200c0 .4.2.7.5.9l2 1.200c.5.3 1.100.2 1.500-.2l1.500-1.500c.5-.5.5-1.300 0-1.800C17.800 9 15 8 12 8z"/></svg><span>退出</span></button>
  </nav>
</section>

<dialog id="dBgm">
  <div class="row" style="align-items:center;justify-content:space-between">
    <h2 style="font:700 20px 'Shippori Mincho B1',serif;color:var(--sand)">BGM</h2>
    <button id="bClose" type="button" style="flex:none;width:auto">閉じる</button>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab on" type="button" role="tab" data-t="tYt">YouTube</button>
    <button class="tab" type="button" role="tab" data-t="tFl">音声ファイル</button>
  </div>

  <section id="tYt">
    <label for="bUrl" style="margin-top:0">曲名で検索、またはURL</label>
    <div class="row"><input id="bUrl" placeholder="曲名・アーティスト名、またはURL" autocomplete="off"><button id="bSearch" type="button">検索</button></div>
    <div class="row" style="margin-top:12px"><button class="main" id="bPlay">再生</button><button id="bPause">一時停止</button><button id="bStop">停止</button></div>
    <div id="ysr"></div>
    <details style="margin-top:8px"><summary style="color:var(--dim);cursor:pointer;min-height:44px;display:flex;align-items:center">YouTube検索の設定</summary>
      <label for="yKey">YouTube Data API v3 のキー(任意)</label><input id="yKey" placeholder="AIza..." autocomplete="off">
      <p style="color:var(--dim);font-size:13px;margin-top:6px">未入力でも公開の検索サーバー経由で検索しますが、止まっていることがあります。確実に使うならキーを入れてください(無料枠で1日約100回検索できます)。</p></details>
  </section>

  <section id="tFl" class="hide">
    <label for="bFile" style="margin-top:0">自分の音声ファイル(全員に聞こえます)</label>
    <input type="file" id="bFile" accept="audio/*,.mp3,.m4a,.wav,.flac,.ogg,.aac">
    <audio id="aFile" controls class="hide" style="width:100%;margin-top:10px"></audio>
    <button id="bFileOff" class="hide" type="button" style="margin-top:10px;width:100%">ファイルを外す</button>
    <label>お気に入り(5つまで)</label><div id="favList"></div>
    <label>履歴(10個まで)</label><div id="histList"></div>
  </section>

  <div class="bshare">
    <p id="bTitle" style="color:var(--dim);min-height:1.6em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></p>
    <label for="bVol" style="margin-top:4px">音量</label><input type="range" id="bVol" min="0" max="100" value="30">
    <details><summary style="color:var(--dim);cursor:pointer;min-height:44px;display:flex;align-items:center">オプション</summary>
      <label class="chk"><input type="checkbox" id="bLoop" checked>くり返す</label>
      <label class="chk"><input type="checkbox" id="bDuck">誰かが話している間は音量を下げる</label>
      <label class="chk"><input type="checkbox" id="bListen" checked>他の人が流すBGMも聴く</label>
      <label class="chk"><input type="checkbox" id="bNs" checked>BGM中は自分のマイクのノイズ除去を切る(歌がこもるとき)</label>
      <p style="color:var(--dim);font-size:13px;margin-top:10px">再生すると通話中の全員の端末で同時に流れます(音量は各自で調整できます)。スピーカーだとマイクに入るので、イヤホンがおすすめです。</p>
    </details>
  </div>
</dialog>
<div style="position:fixed;left:-9999px;top:0;width:200px;height:113px" aria-hidden="true"><div id="ytp"></div></div>
<dialog id="dlg">
  <h2 style="font:700 20px 'Shippori Mincho B1',serif;color:var(--sand)">設定</h2>
  <label>マイク</label><select id="sMic"></select>
  <label>カメラ</label><select id="sCam"></select>
  <label>スピーカー</label><select id="sSpk"></select>
  <label>テーマカラー</label><div class="sws" id="sw2"></div>
  <div class="row">
    <div><label>映像の解像度</label><select id="sRes"><option value="720">720p</option><option value="1080" selected>1080p</option><option value="1440">1440p</option></select></div>
    <div><label>フレームレート</label><select id="sFps"><option>30</option><option>60</option></select></div>
    <div><label>映像の上限</label><select id="sBr"><option value="2000">2 Mbps</option><option value="4000" selected>4 Mbps</option><option value="8000">8 Mbps</option></select></div>
  </div>
  <label class="chk"><input type="checkbox" id="cEcho" checked>エコー除去(ヘッドホン使用時はオフで高音質)</label>
  <label class="chk"><input type="checkbox" id="cNs" checked>ノイズ除去</label>
  <label class="chk"><input type="checkbox" id="cAgc">音量の自動調整</label>
  <div class="row" style="margin-top:20px"><button class="main" id="sOk">適用して閉じる</button></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $=s=>document.querySelector(s),PFX='betsuhan-v1-',AL='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const RES={720:[1280,720],1080:[1920,1080],1440:[2560,1440]};
const cfg={mic:'',cam:'',spk:'',res:1080,fps:30,br:4000,echo:true,ns:true,agc:false,facing:'user'};
const COLORS=['#d6c7a1','#6fc2b0','#e0a458','#8fb8e8','#c58fe0','#e08fa8'];
let myColor=(()=>{try{return localStorage.getItem('pms-color')}catch(_){}})()||COLORS[0];
const rgb=c=>{const n=parseInt(c.slice(1),16);return[n>>16,(n>>8)&255,n&255]};
const lum=c=>{const f=v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4},[r,g,b]=rgb(c);return .2126*f(r)+.7152*f(g)+.0722*f(b)};
const hex=a=>'#'+a.map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
const onColor=c=>lum(c)>.4?'#14110a':'#ffffff';
function readable(c){let x=c;for(let i=0;i<8&&lum(x)<.22;i++)x=hex(rgb(x).map(v=>v+(255-v)*.18));return x}
function setTileColor(el,c){el.style.setProperty('--c',c);el.style.setProperty('--on',onColor(c))}
function paintTheme(c){myColor=c;const t=readable(c),r=document.documentElement.style;r.setProperty('--sand',t);r.setProperty('--on',onColor(t));try{localStorage.setItem('pms-color',c)}catch(_){}}
function setMyColor(c){paintTheme(c);if(peers.self&&peers.self.el){setTileColor(peers.self.el,c);broadcast({t:'color',color:c});recolorMarks()}}
function swatches(el,pick){el.innerHTML='';

    const K=kf.var/(kf.var+acc*acc);kf.lat+=K*(c.latitude-kf.lat);kf.lng+=K*(c.longitude-kf.lng);kf.var*=1-K}
  kf.ts=ts;mine={lat:kf.lat,lng:kf.lng,acc:Math.sqrt(kf.var)};
  setMark('me',myName+'(自分)',mine);const n=Date.now();if(n-lastSend>1000){lastSend=n;broadcast({t:'loc',...mine})}}
function stopLoc(){if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;mine=null;kf.var=-1;broadcast({t:'loc',off:true});delMark('me');
  const b=$('#bLoc');b.classList.remove('on');b.classList.add('x');peers.self.nm.classList.remove('lc')}
$('#bLoc').onclick=()=>{
  if(watchId!==null)return stopLoc();
  if(!navigator.geolocation)return toast('この端末では位置情報を使えません');
  if(!confirm('この回線の参加者全員に、あなたの現在地をリアルタイムで共有します。いつでも停止できます。よろしいですか?'))return;
  gpsWarn=false;kf.var=-1;
  watchId=navigator.geolocation.watchPosition(onFix,er=>{if(er.code===1){toast('位置情報の使用が許可されていません');stopLoc()}else if(!gpsWarn){gpsWarn=true;toast('GPSを探しています…')}},
    {enableHighAccuracy:true,maximumAge:0,timeout:30000});
  const b=$('#bLoc');b.classList.add('on');b.classList.remove('x');peers.self.nm.classList.add('lc')};

// BGM(YouTube):URLと再生位置を共有し、各自の端末で同時に再生する
let yt=null,ytP=null,ytMake=false,ytPend=null,cur=null,inList=false,lastUrl='',lastV=-1,bgmOwner=false;
function loadYT(){return ytP||(ytP=new Promise(res=>{const t=document.createElement('script');t.src='https://www.youtube.com/iframe_api';document.head.append(t);window.onYouTubeIframeAPIReady=res}))}
function parseYT(u){try{const x=new URL(u.trim());let v=x.searchParams.get('v');if(x.hostname==='youtu.be')v=x.pathname.slice(1);
  const m=x.pathname.match(/\/(shorts|embed|live)\/([\w-]{11})/);if(m)v=m[2];return{v:v&&v.slice(0,11),list:x.searchParams.get('list')}}catch(_){return{}}}
const bgmUI=on=>$('#bBgm').classList.toggle('on',on);
const ready=()=>yt&&yt.loadVideoById&&yt.getPlayerState;
function ytGo(){const o=ytPend;if(!o)return;ytPend=null;inList=!!o.list;cur={v:o.v||null,list:o.list||null};
  o.list?yt.loadPlaylist({list:o.list,listType:'playlist',index:o.idx||0,startSeconds:o.pos||0}):yt.loadVideoById({videoId:o.v,startSeconds:o.pos||0});
  yt.setLoop&&yt.setLoop(o.loop!==false)}
async function ytLoad(o){ytPend=o;await loadYT();if(ready())return ytGo();if(ytMake)return;ytMake=true;
  yt=new YT.Player('ytp',{width:200,height:113,playerVars:{playsinline:1,controls:0},events:{
    onReady:e=>{e.target.setVolume(+$('#bVol').value);lastV=+$('#bVol').value;ytGo()},
    onStateChange:e=>{const st=e.data;bgmUI(st===1);
      if(st===1&&bgmOwner){try{$('#bTitle').textContent='♪ '+e.target.getVideoData().title}catch(_){}}
      if(st===0&&!inList&&$('#bLoop').checked){e.target.seekTo(0);e.target.playVideo()}},
    onError:()=>{toast('この動画は再生できません(埋め込み不可の可能性)');bgmUI(false)}}})}
function bgmState(a){const g=f=>{try{return yt[f]()}catch(_){return 0}};
  return{t:'bgm',a,v:cur&&cur.v,list:cur&&cur.list,pos:g('getCurrentTime'),idx:g('getPlaylistIndex'),loop:$('#bLoop').checked}}
const sendBgm=a=>cur&&broadcast(bgmState(a));
function bgmHello(c){if(bgmOwner&&ready()&&yt.getPlayerState()===1)c.send(bgmState('play'))}
function stopLocal(){if(ready())yt.stopVideo();$('#bTitle').textContent='';bgmUI(false)}
function onBgm(m,name){if(!$('#bListen').checked)return;
  if(m.a==='stop'){bgmOwner=false;stopLocal();return}
  if(m.a==='pause'){ready()&&yt.pauseVideo();return}
  const same=cur&&cur.v===(m.v||null)&&cur.list===(m.list||null);
  if(m.a==='sync'){if(!same||!ready())return;const st=yt.getPlayerState();
    if(m.list&&yt.getPlaylistIndex&&yt.getPlaylistIndex()!==m.idx){yt.playVideoAt(m.idx);return}
    if(st===1&&Math.abs(yt.getCurrentTime()-m.pos)>2.5)yt.seekTo(m.pos,true);return}
  bgmOwner=false;$('#bTitle').textContent='♪ '+name+' のBGM';
  if(same&&ready()){yt.seekTo(m.pos+.3,true);yt.playVideo();return}
  ytLoad({v:m.v,list:m.list,pos:m.pos+.4,idx:m.idx,loop:m.loop});
  setTimeout(()=>{if(!ready()||yt.getPlayerState()!==1)toast('BGMが始まらないときは ♪ BGM を開いて「再生」を押してください')},3500)}
$('#bBgm').onclick=()=>$('#dBgm').showModal();$('#bClose').onclick=()=>$('#dBgm').close();
$('#bPlay').onclick=async()=>{aFile.pause();const u=$('#bUrl').value.trim();
  if(ready()&&u===lastUrl&&yt.getPlayerState()!==-1){yt.playVideo();bgmOwner=true;sendBgm('play');return}
  if(!u&&cur&&ready()){yt.playVideo();return}
  const{v,list}=parseYT(u);if(!v&&!list)return toast('YouTubeのURLを入力してください');
  lastUrl=u;bgmOwner=true;await ytLoad({v,list,pos:0,loop:$('#bLoop').checked});
  setTimeout(()=>sendBgm('play'),900)};
$('#bPause').onclick=()=>{if(!ready())return;yt.pauseVideo();if(bgmOwner)sendBgm('pause')};
$('#bStop').onclick=()=>{if(bgmOwner)sendBgm('stop');bgmOwner=false;stopLocal()};
$('#bLoop').onchange=()=>{aFile.loop=$('#bLoop').checked;ready()&&yt.setLoop&&yt.setLoop($('#bLoop').checked)};
$('#bListen').onchange=e=>{if(!e.target.checked&&!bgmOwner)stopLocal()};
setInterval(()=>{if(bgmOwner&&ready()&&yt.getPlayerState()===1)sendBgm('sync')},8000);
setInterval(()=>{if(!ready())return;try{const d=$('#bDuck').checked&&document.querySelector('.tile.speaking:not(.self)'),v=+$('#bVol').value*(d?.35:1);if(v!==lastV){lastV=v;yt.setVolume(v)}}catch(_){}},300);

// 自分の音声ファイルを通話で全員に送る(WebRTCで高音質ステレオ送信)
let aSrc=null,aGain=null,aDest=null,musicName='';
const aFile=$('#aFile');
function loadMusic(blob,name){actx=actx||new AudioContext();actx.resume();
  if(aFile.src)URL.revokeObjectURL(aFile.src);
  aFile.src=URL.createObjectURL(blob);aFile.loop=$('#bLoop').checked;aFile.classList.remove('hide');$('#bFileOff').classList.remove('hide');
  if(!aSrc){aSrc=actx.createMediaElementSource(aFile);aGain=actx.createGain();aGain.gain.value=+$('#bVol').value/100;aSrc.connect(aGain);aGain.connect(actx.destination)}
  stopKind('music');aDest&&aSrc.disconnect(aDest);
  aDest=actx.createMediaStreamDestination();aDest.stream.getAudioTracks()[0].contentHint='music';aSrc.connect(aDest);local.music=aDest.stream;sendKind('music',local.music);
  musicName=name;broadcast({t:'music',name});$('#bTitle').textContent='♪ '+name;aFile.play().catch(()=>{})}
const baseName=n=>n.replace(/\.[^.]+$/,'');
$('#bFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;loadMusic(f,baseName(f.name));await saveHist(f);e.target.value=''};
// 履歴(10個)とお気に入り(5つ)はこのブラウザ内(IndexedDB)に保存
const idb=()=>new Promise((ok,ng)=>{const r=indexedDB.open('pms-audio',1);r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)});
const dbDo=async(m,a)=>{const d=await idb();return new Promise(ok=>{const t=d.transaction('f',m==='getAll'?'readonly':'readwrite'),q=t.objectStore('f')[m](a);t.oncomplete=()=>ok(q.result);t.onerror=t.onabort=()=>ok(null)})};
async function libAll(){try{return(await dbDo('getAll'))||[]}catch(_){return[]}}
async function prune(){const h=(await libAll()).filter(x=>!x.fav).sort((a,b)=>b.t-a.t);for(const x of h.slice(10))await dbDo('delete',x.id)}
async function saveHist(f){try{const all=await libAll(),ex=all.find(x=>x.fn===f.name&&x.size===f.size);
  if(ex){ex.t=Date.now();await dbDo('put',ex)}else await dbDo('put',{id:Date.now()+'-'+Math.random().toString(36).slice(2,7),fn:f.name,size:f.size,t:Date.now(),fav:false,blob:f.slice(0,f.size,f.type)});
  await prune()}catch(_){}renderLib()}
async function renderLib(){const all=(await libAll()).sort((a,b)=>b.t-a.t);
  const mk=(box,arr,empty)=>{box.innerHTML='';if(!arr.length){box.innerHTML='<p style="color:var(--dim);font-size:13px;margin-top:6px">'+empty+'</p>';return}
    arr.forEach(x=>{const r=document.createElement('div');r.className='lr';
      const p=document.createElement('button');p.type='button';p.className='lp';p.textContent='♪ '+baseName(x.fn);p.title=x.fn;
      p.onclick=async()=>{loadMusic(x.blob,baseName(x.fn));x.t=Date.now();await dbDo('put',x);renderLib()};
      const st=document.createElement('button');st.type='button';st.className='ls'+(x.fav?' on':'');st.textContent=x.fav?'★':'☆';st.setAttribute('aria-label','お気に入り');
      st.onclick=async()=>{if(!x.fav&&all.filter(y=>y.fav).length>=5)return toast('お気に入りは5つまでです');x.fav=!x.fav;await dbDo('put',x);await prune();renderLib()};
      const d=document.createElement('button');d.type='button';d.className='lx';d.textContent='✕';d.setAttribute('aria-label','削除');
      d.onclick=async()=>{await dbDo('delete',x.id);renderLib()};
      r.append(p,st,d);box.append(r)})};
  mk($('#favList'),all.filter(x=>x.fav).slice(0,5),'★を押すとここに登録できます');
  mk($('#histList'),all.filter(x=>!x.fav).slice(0,10),'ファイルを選ぶと履歴に残ります')}
renderLib();
// YouTube検索(APIキーがあれば公式API、なければ公開の検索サーバーを順に試す)
try{$('#yKey').value=localStorage.getItem('pms-ykey')||''}catch(_){}
$('#yKey').onchange=()=>{try{localStorage.setItem('pms-ykey',$('#yKey').value.trim())}catch(_){}};
const dec=t=>{const e=document.createElement('textarea');e.innerHTML=t;return e.value};
async function apiSearch(q,key){const r=await fetch('https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults=10&q='+encodeURIComponent(q)+'&key='+encodeURIComponent(key));
  const j=await r.json();if(j.error){toast('APIキーのエラー:'+(j.error.message||'').slice(0,50));return null}
  return(j.items||[]).map(x=>({id:x.id.videoId,title:dec(x.snippet.title),ch:dec(x.snippet.channelTitle)}))}
const PIPED=['https://pipedapi.kavin.rocks','https://api.piped.private.coffee','https://pipedapi.adminforge.de'];
async function pipedSearch(q){for(const b of PIPED){try{const c=new AbortController(),to=setTimeout(()=>c.abort(),4500);
  const r=await fetch(b+'/search?q='+encodeURIComponent(q)+'&filter=videos',{signal:c.signal});clearTimeout(to);if(!r.ok)continue;
  const it=((await r.json()).items||[]).filter(x=>x.url&&x.url.includes('v=')).slice(0,10).map(x=>({id:new URL(x.url,'https://x.invalid').searchParams.get('v'),title:x.title,ch:x.uploaderName}));
  if(it.length)return it}catch(_){}}return null}
function showResults(items){const box=$('#ysr');box.innerHTML='';
  items.forEach(x=>{const b=document.createElement('button');b.type='button';b.className='sr';
    const im=new Image();im.src='https://i.ytimg.com/vi/'+x.id+'/mqdefault.jpg';im.alt='';
    const d=document.createElement('div'),t=document.createElement('b'),c=document.createElement('span');t.textContent=x.title;c.textContent=x.ch||'';d.append(t,c);b.append(im,d);
    b.onclick=()=>{$('#bUrl').value='https://www.youtube.com/watch?v='+x.id;$('#bPlay').click()};box.append(b)})}
async function ySearch(){const q=$('#bUrl').value.trim();if(!q)return toast('検索ワードを入力してください');
  const u=parseYT(q);if(u.v||u.list){$('#bPlay').click();return}
  const box=$('#ysr');box.innerHTML='<p style="color:var(--dim);margin-top:8px">検索中…</p>';
  let items=null;const key=$('#yKey').value.trim();
  if(key){try{items=await apiSearch(q,key)}catch(_){}}
  if(!items)items=await pipedSearch(q);
  if(!items||!items.length){box.innerHTML='<p style="color:var(--dim);margin-top:8px">検索できませんでした。「YouTube検索の設定」にAPIキーを入れると安定します。</p>';return}
  showResults(items)}
$('#bSearch').onclick=ySearch;$('#bUrl').onkeydown=e=>{if(e.key==='Enter')ySearch()};
$('#bFileOff').onclick=()=>{aFile.pause();aFile.removeAttribute('src');aFile.load();aFile.classList.add('hide');$('#bFileOff').classList.add('hide');
  stopKind('music');aDest&&aSrc.disconnect(aDest);aDest=null;broadcast({t:'music',off:true});$('#bTitle').textContent=''};
aFile.onplay=()=>{if(ready()&&yt.getPlayerState()===1){if(bgmOwner)sendBgm('stop');bgmOwner=false;yt.pauseVideo()}};
setInterval(()=>{const d=$('#bDuck').checked&&document.querySelector('.tile.speaking:not(.self)'),v=+$('#bVol').value/100*(d?.35:1),mute=!$('#bListen').checked;
  Object.values(peers).forEach(p=>{if(p.music){p.music.volume=Math.min(1,v);p.music.muted=mute}});if(aGain)aGain.gain.value=v},300);

// BGMが流れている間はマイクのノイズ除去を切る(スピーカーから漏れたBGMが加工されて相手に届くのを防ぐ)
let lastAct=null,lastTr=null;
setInterval(()=>{const t=local.mic&&local.mic.getAudioTracks()[0];if(!t)return;
  const act=$('#bNs').checked&&!!((ready()&&yt.getPlayerState()===1)||(aFile.src&&!aFile.paused)||Object.values(peers).some(p=>p.music&&!p.music.muted));
  if(act===lastAct&&t===lastTr)return;lastAct=act;lastTr=t;
  t.applyConstraints({noiseSuppression:act?false:cfg.ns,autoGainControl:cfg.agc}).catch(()=>{})},500);
// BGM画面のタブ切り替え
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(t=>{const on=t===b;t.classList.toggle('on',on);$('#'+t.dataset.t).classList.toggle('hide',!on)})});
// 設定
$('#bSet').onclick=async()=>{const d=await navigator.mediaDevices.enumerateDevices();
  const fill=(id,kind,cur)=>{$(id).innerHTML='<option value="">既定</option>'+d.filter(x=>x.kind===kind).map(x=>`<option value="${x.deviceId}"${x.deviceId===cur?' selected':''}>${x.label||kind}</option>`).join('')};
  fill('#sMic','audioinput',cfg.mic);fill('#sCam','videoinput',cfg.cam);fill('#sSpk','audiooutput',cfg.spk);$('#dlg').showModal()};
$('#sOk').onclick=async()=>{Object.assign(cfg,{mic:$('#sMic').value,cam:$('#sCam').value,spk:$('#sSpk').value,res:+$('#sRes').value,fps:+$('#sFps').value,br:+$('#sBr').value,echo:$('#cEcho').checked,ns:$('#cNs').checked,agc:$('#cAgc').checked});
  $('#dlg').close();
  try{const n=await navigator.mediaDevices.getUserMedia({audio:audioC()});const nt=n.getAudioTracks()[0];nt.enabled=!muted;
    Object.values(peers).forEach(p=>p.out&&p.out.mic&&p.out.mic.peerConnection.getSenders().forEach(s=>s.track&&s.track.kind==='audio'&&s.replaceTrack(nt)));
    local.mic.getTracks().forEach(t=>t.stop());local.mic=n;watchStream(n,peers.self.el)}catch(e){toast('マイクを切り替えられません')}
  Object.values(peers).forEach(p=>p.audio&&p.audio.setSinkId&&cfg.spk&&p.audio.setSinkId(cfg.spk).catch(()=>{}));
  if(local.cam){camOff();camOn()}};

// 回線状態(遅延・パケットロス)
setInterval(async()=>{let rtt=null,loss=0;
  for(const p of Object.values(peers)){const c=p.out&&p.out.mic;if(!c||!c.peerConnection)continue;
    (await c.peerConnection.getStats()).forEach(r=>{if(r.type==='candidate-pair'&&r.nominated&&r.currentRoundTripTime!=null)rtt=Math.max(rtt||0,r.currentRoundTripTime*1000);
      if(r.type==='remote-inbound-rtp'&&r.kind==='audio'&&r.fractionLost!=null)loss=Math.max(loss,r.fractionLost*100)})}
  const h=$('#hud');if(rtt===null){h.innerHTML='<i></i>相手を待っています';return}
  const bad=rtt>150||loss>5;h.innerHTML=`<i style="background:${bad?'var(--bad)':'var(--ok)'}"></i>遅延 ${rtt.toFixed(0)}ms ・ 損失 ${loss.toFixed(1)}%`},2000);

paintTheme(myColor);renderSw();
$('#create').onclick=()=>enter(true);$('#join').onclick=()=>enter(false);
if(location.hash.length>1){$('#code').value=location.hash.slice(1).toUpperCase();$('#name').focus()}
</script>
</body>
